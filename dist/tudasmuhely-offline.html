      var m = model(v.t), s = '';
      for (var g = 0; g <= 5; g++) s += '<line x1="' + sx(g) + '" y1="' + Y0 + '" x2="' + sx(g) + '" y2="' + (Y0 - H) + '" class="svg-grid"/><text x="' + sx(g) + '" y="' + (Y0 + 16) + '" text-anchor="middle" font-size="11" class="svg-muted">' + g + '</text>';
      for (var i = 0; i <= IMAX; i += 10) s += '<line x1="' + X0 + '" y1="' + sy(i) + '" x2="' + (X0 + W) + '" y2="' + sy(i) + '" class="svg-grid"/><text x="' + (X0 - 6) + '" y="' + (sy(i) + 4) + '" text-anchor="end" font-size="11" class="svg-muted">' + i + '</text>';
      s += '<text x="' + (X0 + W) + '" y="' + (Y0 + 30) + '" text-anchor="end" font-size="11" class="svg-muted">U_DS [V]</text><text x="6" y="' + (Y0 - H - 6) + '" font-size="11" class="svg-muted">I_D [mA]</text>';
      // telítési határ (U_DS = U_GS − U_T) parabolája
      var b = '';
      for (var u = 0; u <= 4.6; u += 0.1) { var ib = m.k / 2 * u * u * (1 + m.lam * u); b += (u ? 'L' : 'M') + sx(u).toFixed(1) + ' ' + sy(ib).toFixed(1); }
      s += '<path d="' + b + '" fill="none" stroke="var(--muted)" stroke-dasharray="4 4"/>';
      [1, 2, 3, 4, 5].forEach(function (g) {
        var d = '';
        for (var x = 0; x <= 5.001; x += 0.05) d += (x ? 'L' : 'M') + sx(x).toFixed(1) + ' ' + sy(id(m, g, x)).toFixed(1);
        s += '<path d="' + d + '" fill="none" stroke="#8d96a8" stroke-width="1.5"/><text x="' + (X0 + W + 3) + '" y="' + (sy(id(m, g, 5)) + 4) + '" font-size="10" class="svg-muted">' + g + 'V</text>';
      });
      var cur = '';
      for (var x2 = 0; x2 <= 5.001; x2 += 0.05) cur += (x2 ? 'L' : 'M') + sx(x2).toFixed(1) + ' ' + sy(id(m, v.ugs, x2)).toFixed(1);
      var I = id(m, v.ugs, v.uds);
      s += '<path d="' + cur + '" fill="none" stroke="#2f7bf6" stroke-width="3"/><circle cx="' + sx(v.uds) + '" cy="' + sy(I) + '" r="6" fill="#e5484d" stroke="var(--surface)" stroke-width="2"/>';
      el.querySelector('#p').innerHTML = s;
      var ov = v.ugs - m.ut, reg = ov <= 0 ? 'lezárt (cut-off)' : v.uds < ov ? 'lineáris / trióda' : 'telítéses (aktív)';
      var gm = ov <= 0 ? 0 : v.uds < ov ? m.k * v.uds : m.k * ov * (1 + m.lam * v.uds);
      el.querySelector('#r').innerHTML = res([['Munkatartomány', reg], ['Drain-áram (I_D)', fmt(I, 2) + ' mA'], ['Küszöbfeszültség (U_T)', fmt(m.ut, 3) + ' V'], ['U_DS,sat = U_GS − U_T', ov > 0 ? fmt(ov, 2) + ' V' : '–'], ['Meredekség (g_m)', fmt(gm, 2) + ' mS'], ['k (μ·C_ox·W/L)', fmt(m.k, 2) + ' mA/V²']]);
      el.querySelector('#m').innerHTML = '<div class="w-msg ' + (ov <= 0 ? 'warn' : 'ok') + '">' + (ov <= 0 ? 'U_GS < U_T: nincs inverziós csatorna, a tranzisztor zárva van (digitálisan: kikapcsolt állapot).'
        : v.uds < ov ? 'Lineáris tartomány: a csatorna végig kialakult, a tranzisztor vezérelt ellenállásként viselkedik (digitálisan: bekapcsolt kapcsoló).'
          : 'Telítés: a csatorna a drain felől elzáródott (pinch-off), az áram alig függ U_DS-től. Analóg erősítők itt dolgoznak.') + '</div>';
    });
  });

  /* ---------- 14. Processzor teljesítményfelvétele (egyetemi) ---------- */
  S.addWidget('cpu-teljesitmeny', function (el, o) {
    el.innerHTML = head(o.title || 'Mennyit fogyaszt egy processzor? P = α·C·V²·f + P_szivárgás', o.help || 'Állítsd a paramétereket, és figyeld, hogyan nő a hőtermelés. A feszültség négyzetesen számít!') +
      '<div class="w-grid"><div class="w-ctrl">' + rng('f', 'Órajel (f)', 0.5, 6, 0.1, 4, 'GHz') + rng('v', 'Tápfeszültség (V)', 0.6, 1.5, 0.01, 1.2, 'V') +
      rng('c', 'Kapcsolt kapacitás (C)', 2, 60, 1, 25, 'nF') + rng('a', 'Aktivitási tényező (α)', 0.05, 0.6, 0.01, 0.2, '') + rng('il', 'Szivárgási áram', 0, 40, 1, 10, 'A') +
      '</div><div class="w-out"><svg class="w-svg" viewBox="0 0 360 150" id="b"></svg><div id="r"></div><div id="m"></div></div></div>';
    bind(el, function (v) {
      var pd = v.a * v.c * v.v * v.v * v.f, pl = v.il * v.v, P = pd + pl, sc = 320 / Math.max(250, P);
      el.querySelector('#b').innerHTML = '<rect x="20" y="40" width="' + (pd * sc).toFixed(1) + '" height="40" fill="#f08c2e" rx="4"/><rect x="' + (20 + pd * sc).toFixed(1) + '" y="40" width="' + (pl * sc).toFixed(1) + '" height="40" fill="#7c5cd6" rx="4"/>' +
        '<line x1="' + (20 + 125 * sc) + '" y1="26" x2="' + (20 + 125 * sc) + '" y2="96" stroke="#e5484d" stroke-dasharray="4 3" stroke-width="2"/><text x="' + (16 + 125 * sc) + '" y="22" font-size="11" text-anchor="end" fill="#e5484d">asztali hűtés határa ~125 W</text>' +
        '<rect x="20" y="112" width="12" height="12" fill="#f08c2e"/><text x="38" y="122" font-size="11" class="svg-text">dinamikus (kapcsolás)</text><rect x="180" y="112" width="12" height="12" fill="#7c5cd6"/><text x="198" y="122" font-size="11" class="svg-text">statikus (szivárgás)</text>';
      el.querySelector('#r').innerHTML = res([['Dinamikus', fmt(pd, 1) + ' W'], ['Szivárgási', fmt(pl, 1) + ' W'], ['Összesen', fmt(P, 1) + ' W'], ['Áramfelvétel', fmt(P / v.v, 0) + ' A']]);
      el.querySelector('#m').innerHTML = '<div class="w-msg ' + (P > 125 ? 'bad' : P > 65 ? 'warn' : 'ok') + '">' + (P > 125 ? 'Ezt egy átlagos hűtő már nem bírja: a processzor visszaveszi az órajelet (thermal throttling).' : P > 65 ? 'Erős hűtés kell (asztali, nagy teljesítményű kategória).' : 'Laptopban vagy kis gépben is hűthető.') +
        ' Figyeld meg: a ' + fmt(P / v.v, 0) + ' A-es áramot az alaplap feszültségszabályzójának (VRM) kell előállítania!</div>';
    });
  });
})();

</script>
  <script>/* js/explorer.js */
/* Tudásműhely – „Mi miből áll?” felfedező.
 * Egy modell alkatrészekből áll. Minden alkatrész saját SVG-rajzot, szétszedési
 * eltolást és leírást kap (mi ez, miből van, hogyan készül). Ha egy alkatrésznek
 * van "link" mezője, egy másik modellbe lehet "belenézni" (egy szinttel lejjebb). */
(function () {
  'use strict';
  var S = window.STUDIE;
  var esc = S.esc, md = S.md;

  /* A felfedező lista oldalon megjelenő "utazás a mélybe" láncok. */
  S.chains = [
    ['alaplap', 'processzor', 'tranzisztor', 'atom'],
    ['elektromos-auto', 'akkucella', 'atom']
  ];

  S.renderModel = function (root, m, trail) {
    var exploded = false, selId = null, tab = 'what', step = 0;
    var vb = m.viewBox || '0 0 600 420';

    var crumbs = '<a href="#/">Kezdőlap</a><span>›</span><a href="#/felfedezo">Mi miből áll?</a>';
    trail.forEach(function (id, i) {
      var tm = S.models[id]; if (!tm) return;
      crumbs += '<span>›</span>' + (i === trail.length - 1 ? '<span>' + esc(tm.title) + '</span>'
        : '<a href="#/felfedezo/' + trail.slice(0, i + 1).join('/') + '">' + esc(tm.title) + '</a>');
    });

    // Rajzolási sorrend: kisebb z hátrébb (alul) van. A számozás a lista sorrendjét követi.
    var drawOrder = m.parts.map(function (p, i) { return { p: p, i: i }; })
      .sort(function (a, b) { return ((a.p.z || 0) - (b.p.z || 0)) || (a.i - b.i); });
    var partsSvg = drawOrder.map(function (o) {
      var p = o.p, i = o.i;
      return '<g class="part" data-id="' + p.id + '" tabindex="0" role="button" aria-label="' + esc((i + 1) + '. ' + p.name) + '">' +
        '<title>' + esc(p.name) + '</title>' + p.svg + '</g>';
    }).join('');

    root.innerHTML =
      '<nav class="crumbs">' + crumbs + '</nav>' +
      '<h1>' + m.icon + ' ' + esc(m.title) + '</h1><p class="lead">' + esc(m.summary) + '</p>' +
      '<div class="ex-layout">' +
      '<div class="ex-stage card"><div class="ex-toolbar">' +
      '<button type="button" class="btn primary" id="ex-explode">⇱ Szétszedés</button>' +
      '<button type="button" class="btn on" id="ex-badges">① Számok</button>' +
      '<span class="zoom-btns"><button type="button" class="btn" id="ex-zin" aria-label="Nagyítás">＋</button><button type="button" class="btn" id="ex-zout" aria-label="Kicsinyítés">−</button><button type="button" class="btn" id="ex-zreset" aria-label="Teljes nézet">⟲</button></span>' +
      (m.scale ? '<span class="scale">Valódi méret: ' + esc(m.scale) + '</span>' : '') + '</div>' +
      '<svg class="ex-svg" id="ex-svg" viewBox="' + vb + '" role="group" aria-label="' + esc(m.title) + ' alkatrészei">' +
      (m.backdrop || '') + partsSvg + '<g id="ex-parts-end"></g>' + (m.overlay || '') + '<g id="ex-badges-layer"></g></svg>' +
      '<div class="part-chips" id="ex-chips">' + m.parts.map(function (p, i) {
        return '<button type="button" data-id="' + p.id + '"><i>' + (i + 1) + '</i>' + esc(p.name) + '</button>';
      }).join('') + '</div></div>' +
      '<aside class="ex-info card" id="ex-info" aria-live="polite"></aside></div>' +
      (m.steps && m.steps.length ? '<h2>Hogyan készül? – lépésről lépésre</h2><div class="steps card" id="ex-steps"></div>' : '') +
      (m.history && m.history.length ? '<h2>Történet: mikor és hogyan alakult ki?</h2><ul class="history">' + m.history.map(function (h) {
        return '<li><b>' + esc(h.year) + '</b>' + S.inline(h.text) + '</li>';
      }).join('') + '</ul>' : '') +
      (m.uni ? (S.level === 'egyetem'
        ? '<h2>🎓 Egyetemi mélység</h2><div class="lesson-body">' + md(m.uni.text || '') + '</div>' + (m.uni.widgets || []).map(function (w) {
          return '<div class="widget card" data-widget="' + esc(JSON.stringify(w)) + '"></div>';
        }).join('') + (S.termCards ? S.termCards(m.uni.terms, 'Kapcsolódó szakszavak') : '')
        : '<div class="note uni-hint" style="margin-top:24px"><b class="t">🎓 Egyetemistáknak</b><p>Ehhez a modellhez paraméterezhető szimuláció, képletek és angol szakszavak is tartoznak. <button type="button" class="linkish" data-level="egyetem">Váltás egyetemi szintre</button></p></div>') : '') +
      (m.quiz && m.quiz.length ? '<h2>Ellenőrizd magad!</h2><div class="quiz card" id="ex-quiz"></div>' : '');

    var svg = root.querySelector('#ex-svg');
    var info = root.querySelector('#ex-info');
    var byId = {};
    m.parts.forEach(function (p, i) { byId[p.id] = { p: p, n: i + 1 }; });

    /* Számjelölők: ha a modell nem ad meg helyet (badge: [x, y]), az alkatrész közepére kerülnek. */
    var badgeLayer = svg.querySelector('#ex-badges-layer'), bhtml = '';
    m.parts.forEach(function (p, i) {
      var pos = p.badge;
      if (!pos) {
        var g = svg.querySelector('.part[data-id="' + p.id + '"]'), bb = null;
        try { bb = g.getBBox(); } catch (e) { /* nem renderelt */ }
        pos = bb && bb.width ? [bb.x + bb.width / 2, bb.y + bb.height / 2] : [20 + i * 26, 20];
      }
      bhtml += '<g class="badge-g" data-id="' + p.id + '"><circle cx="' + pos[0] + '" cy="' + pos[1] + '" r="11"/>' +
        '<text x="' + pos[0] + '" y="' + pos[1] + '">' + (i + 1) + '</text></g>';
    });
    badgeLayer.innerHTML = bhtml;

    function applyTransforms() {
      svg.querySelectorAll('.part, .badge-g').forEach(function (g) {
        var p = byId[g.dataset.id].p, d = exploded && p.explode ? p.explode : [0, 0];
        g.style.transform = 'translate(' + d[0] + 'px,' + d[1] + 'px)';
      });
    }

    function paintInfo() {
      if (!selId) {
        info.innerHTML = '<h3>Fedezd fel!</h3>' + md(m.intro || '') +
          '<p class="muted">Kattints egy alkatrészre a rajzon vagy a listában. A <b>Szétszedés</b> gombbal szétnyithatod a darabokat.</p>';
        return;
      }
      var e = byId[selId], p = e.p;
      var uni = S.level === 'egyetem';
      var tabs = [['what', 'Mi ez?', p.what], ['made', 'Miből van?', p.madeOf], ['how', 'Hogyan készül?', p.how]].concat(uni && p.uni ? [['uni', '🎓 Egyetemi háttér', p.uni]] : [])
        .filter(function (t) { return t[2]; });
      if (!tabs.some(function (t) { return t[0] === tab; })) tab = tabs[0] ? tabs[0][0] : 'what';
      var cur = tabs.filter(function (t) { return t[0] === tab; })[0];
      var link = p.link && S.models[p.link];
      info.innerHTML = '<h3><span class="n">' + e.n + '</span>' + esc(p.name) + '</h3>' +
        '<div class="tabs" role="tablist">' + tabs.map(function (t) {
          return '<button type="button" role="tab" aria-selected="' + (t[0] === tab) + '" class="' + (t[0] === tab ? 'on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
        }).join('') + '</div>' +
        '<div>' + md(cur ? cur[2] : '') + '</div>' +
        (uni && p.en ? '<p class="muted" style="margin:6px 0 0">🇬🇧 ' + esc(p.en) + '</p>' : '') +
        (uni && S.termCards ? S.termCards(p.terms, 'Szakszavak ehhez az alkatrészhez') : '') +
        (!uni && (p.uni || (p.terms && p.terms.length)) ? '<p class="muted" style="font-size:.88rem;margin-top:10px">🎓 Ehhez az alkatrészhez egyetemi magyarázat is tartozik. <button type="button" class="linkish" data-level="egyetem">Egyetemi szint</button></p>' : '') +
        (p.fact ? '<div class="fact">' + S.inline(p.fact) + '</div>' : '') +
        (link ? '<p style="margin-top:14px"><a class="btn primary" href="#/felfedezo/' + trail.concat(p.link).join('/') + '">🔍 Nézz bele: ' + esc(link.title) + ' →</a></p>' : '') +
        (p.lesson ? '<p><a class="btn" href="#/lecke/' + p.lesson + '">📘 Kapcsolódó lecke</a></p>' : '') +
        '<div class="row" style="margin-top:12px"><button type="button" class="btn" id="ex-prev">←</button><button type="button" class="btn" id="ex-next">→</button>' +
        '<button type="button" class="btn" id="ex-clear">Áttekintés</button></div>';
      info.querySelectorAll('[data-tab]').forEach(function (b) {
        b.addEventListener('click', function () { tab = b.dataset.tab; paintInfo(); });
      });
      info.querySelector('#ex-prev').addEventListener('click', function () { select(m.parts[(e.n - 2 + m.parts.length) % m.parts.length].id); });
      info.querySelector('#ex-next').addEventListener('click', function () { select(m.parts[e.n % m.parts.length].id); });
      info.querySelector('#ex-clear').addEventListener('click', function () { select(null); });
    }

    function select(id, keepTab) {
      selId = id;
      if (!keepTab) tab = 'what';
      highlight(id ? [id] : null);
      root.querySelectorAll('#ex-chips button').forEach(function (b) { b.classList.toggle('on', b.dataset.id === id); });
      paintInfo();
    }
    /* A kijelölt alkatrész(eke)t előrehozzuk, hogy ne takarja el semmi; kijelölés nélkül visszaáll az eredeti sorrend. */
    var partsEnd = svg.querySelector('#ex-parts-end');
    var origOrder = Array.prototype.slice.call(svg.querySelectorAll('.part'));
    function highlight(ids) {
      origOrder.forEach(function (g) { svg.insertBefore(g, partsEnd); });
      if (ids && ids.length) origOrder.forEach(function (g) { if (ids.indexOf(g.dataset.id) >= 0) svg.insertBefore(g, partsEnd); });
      svg.classList.toggle('has-sel', !!(ids && ids.length));
      svg.querySelectorAll('.part, .badge-g').forEach(function (g) {
        g.classList.toggle('sel', !!(ids && ids.indexOf(g.dataset.id) >= 0));
      });
      hlIds = ids && ids.length ? ids : null;
      if (hlIds) zoomToParts(hlIds); else zoomTo(base);
    }

    /* ---------- nagyítás: viewBox animálása ---------- */
    var hlIds = null;
    var base = (function () { var v = vb.split(/[\s,]+/).map(Number); return { x: v[0], y: v[1], w: v[2], h: v[3] }; })();
    var cur = { x: base.x, y: base.y, w: base.w, h: base.h }, anim = null;
    function setVB(v) {
      cur = v;
      svg.setAttribute('viewBox', v.x.toFixed(1) + ' ' + v.y.toFixed(1) + ' ' + v.w.toFixed(1) + ' ' + v.h.toFixed(1));
      var zoomed = v.w < base.w * 0.98;
      // a számjelölők nagyításkor ne nőjenek túl nagyra
      var k = Math.max(0.45, Math.min(1, v.w / base.w));
      badgeLayer.querySelectorAll('circle').forEach(function (c) { c.setAttribute('r', (11 * k).toFixed(2)); });
      badgeLayer.querySelectorAll('text').forEach(function (t) { t.style.fontSize = (12 * k).toFixed(2) + 'px'; });
      svg.classList.toggle('zoomed', zoomed);
      svg.style.touchAction = zoomed ? 'none' : 'manipulation';
    }
    function zoomTo(t) {
      // a képarány mindig az eredeti marad
      var ar = base.w / base.h;
      if (t.w / t.h > ar) { var nh = t.w / ar; t = { x: t.x, y: t.y - (nh - t.h) / 2, w: t.w, h: nh }; }
      else { var nw = t.h * ar; t = { x: t.x - (nw - t.w) / 2, y: t.y, w: nw, h: t.h }; }
      if (t.w > base.w * 1.5) t = { x: base.x, y: base.y, w: base.w, h: base.h };
      var from = cur, t0 = null;
      if (anim) cancelAnimationFrame(anim);
      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return setVB(t);
      function step(ts) {
        if (t0 == null) t0 = ts;
        var k = Math.min(1, (ts - t0) / 550), e = 1 - Math.pow(1 - k, 3);
        setVB({ x: from.x + (t.x - from.x) * e, y: from.y + (t.y - from.y) * e, w: from.w + (t.w - from.w) * e, h: from.h + (t.h - from.h) * e });
        if (k < 1) anim = requestAnimationFrame(step); else anim = null;
      }
      anim = requestAnimationFrame(step);
    }
    function zoomToParts(ids) {
      var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      ids.forEach(function (id) {
        var g = svg.querySelector('.part[data-id="' + id + '"]'), bb;
        try { bb = g.getBBox(); } catch (e) { return; }
        var p = byId[id].p, d = exploded && p.explode ? p.explode : [0, 0];
        x0 = Math.min(x0, bb.x + d[0]); y0 = Math.min(y0, bb.y + d[1]);
        x1 = Math.max(x1, bb.x + bb.width + d[0]); y1 = Math.max(y1, bb.y + bb.height + d[1]);
      });
      if (!isFinite(x0)) return;
      var w = x1 - x0, h = y1 - y0, pad = Math.max(w, h) * 0.35 + 20;
      // ne nagyítson túl: legfeljebb kb. 4-szeres
      var minW = base.w / 4, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      var W = Math.max(w + pad * 2, minW), H = Math.max(h + pad * 2, minW * base.h / base.w);
      zoomTo({ x: cx - W / 2, y: cy - H / 2, w: W, h: H });
    }
    function zoomBy(f) {
      var cx = cur.x + cur.w / 2, cy = cur.y + cur.h / 2, w = Math.min(base.w * 1.2, Math.max(base.w / 8, cur.w * f)), h = w * base.h / base.w;
      zoomTo({ x: cx - w / 2, y: cy - h / 2, w: w, h: h });
    }
    root.querySelector('#ex-zin').addEventListener('click', function () { zoomBy(0.7); });
    root.querySelector('#ex-zout').addEventListener('click', function () { zoomBy(1.43); });
    root.querySelector('#ex-zreset').addEventListener('click', function () { zoomTo(base); });
    // touchpad csippentés / Ctrl + görgő
    svg.addEventListener('wheel', function (e) {
      if (!e.ctrlKey) return;
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? 1.12 : 0.89);
    }, { passive: false });
    // húzással mozgatás nagyított állapotban
    var drag = null, dragged = false;
    svg.addEventListener('pointerdown', function (e) {
      if (!svg.classList.contains('zoomed')) return;
      drag = { x: e.clientX, y: e.clientY, vb: cur, id: e.pointerId }; dragged = false;
    });
    svg.addEventListener('pointermove', function (e) {
      if (!drag || e.pointerId !== drag.id) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!dragged && Math.abs(dx) + Math.abs(dy) < 6) return;
      if (!dragged) { dragged = true; try { svg.setPointerCapture(e.pointerId); } catch (er) { /* nem támogatott */ } }
      var s = drag.vb.w / svg.clientWidth;
      if (anim) { cancelAnimationFrame(anim); anim = null; }
      setVB({ x: drag.vb.x - dx * s, y: drag.vb.y - dy * s, w: drag.vb.w, h: drag.vb.h });
    });
    function endDrag() { drag = null; setTimeout(function () { dragged = false; }, 0); }
    svg.addEventListener('pointerup', endDrag);
    svg.addEventListener('pointercancel', endDrag);
    // húzás után ne számítson kattintásnak
    svg.addEventListener('click', function (e) { if (dragged) { e.stopPropagation(); e.preventDefault(); } }, true);

    svg.querySelectorAll('.part').forEach(function (g) {
      g.addEventListener('click', function () { select(g.dataset.id === selId ? null : g.dataset.id); });
      g.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(g.dataset.id); }
      });
    });
    svg.addEventListener('click', function (ev) { if (!ev.target.closest('.part')) select(null); });
    root.querySelectorAll('#ex-chips button').forEach(function (b) {
      b.addEventListener('click', function () { select(b.dataset.id === selId ? null : b.dataset.id); });
    });
    var exBtn = root.querySelector('#ex-explode');
    exBtn.addEventListener('click', function () {
      exploded = !exploded;
      exBtn.textContent = exploded ? '⇲ Összerakás' : '⇱ Szétszedés';
      applyTransforms();
      if (hlIds) zoomToParts(hlIds);
    });
    var bBtn = root.querySelector('#ex-badges');
    bBtn.addEventListener('click', function () {
      var off = svg.classList.toggle('no-badges');
      bBtn.classList.toggle('on', !off);
    });

    /* Gyártási lépések */
    var stepsBox = root.querySelector('#ex-steps');
    function paintStep() {
      var st = m.steps[step];
      stepsBox.innerHTML = '<div class="step-head"><div class="dots">' + m.steps.map(function (_, i) {
        return '<button type="button" aria-label="' + (i + 1) + '. lépés" class="' + (i === step ? 'on' : i < step ? 'past' : '') + '" data-i="' + i + '"></button>';
      }).join('') + '</div><span class="muted">' + (step + 1) + ' / ' + m.steps.length + '</span></div>' +
        '<div class="step-body"><h3>' + (st.icon ? st.icon + ' ' : '') + esc(st.title) + (st.when ? ' <small>' + esc(st.when) + '</small>' : '') + '</h3>' + md(st.text) + '</div>' +
        '<div class="row"><button type="button" class="btn" id="st-prev"' + (step ? '' : ' disabled') + '>← Előző</button>' +
        '<button type="button" class="btn primary" id="st-next"' + (step < m.steps.length - 1 ? '' : ' disabled') + '>Következő lépés →</button>' +
        (st.parts ? '<button type="button" class="btn" id="st-show">Mutasd a rajzon</button>' : '') + '</div>';
      stepsBox.querySelectorAll('.dots button').forEach(function (b) {
        b.addEventListener('click', function () { step = +b.dataset.i; paintStep(); });
      });
      stepsBox.querySelector('#st-prev').addEventListener('click', function () { step--; paintStep(); });
      stepsBox.querySelector('#st-next').addEventListener('click', function () { step++; paintStep(); });
      var sh = stepsBox.querySelector('#st-show');
      if (sh) sh.addEventListener('click', function () {
        if (st.parts.length === 1) select(st.parts[0]);
        else { select(null); highlight(st.parts); }
        svg.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
    if (stepsBox) paintStep();
    if (m.quiz && m.quiz.length) S.renderQuiz(root.querySelector('#ex-quiz'), m.quiz, 'model/' + m.id);

    if (S.mountWidgets) S.mountWidgets(root);
    applyTransforms();
    var pre = S.params && S.params.resz;
    if (pre && byId[pre]) select(pre); else paintInfo();
  };
})();

</script>
  <script>/* js/app.js */
/* Tudásműhely – alkalmazás: útválasztás, oldalak, keresés, kvíz, haladás. */
(function () {
  'use strict';
  var S = window.STUDIE;
  var esc = S.esc, md = S.md, norm = S.norm;
  var main = document.getElementById('main');
  var LEVELS = { 1: ['kezdő', 'l1'], 2: ['haladó', 'l2'], 3: ['profi', 'l3'] };

  /* ---------- haladás ---------- */
  var progress = S.store.get('progress', {});
  function lessonKey(sid, lid) { return sid + '/' + lid; }
  function isDone(sid, lid) { var p = progress[lessonKey(sid, lid)]; return !!(p && p.done); }
  function setProgress(key, patch) {
    progress[key] = Object.assign({}, progress[key] || {}, patch);
    S.store.set('progress', progress);
  }
  function subjectStats(s) {
    var done = s.lessons.filter(function (l) { return isDone(s.id, l.id); }).length;
    return { done: done, total: s.lessons.length, pct: s.lessons.length ? Math.round(done / s.lessons.length * 100) : 0 };
  }
  S.progress = { setProgress: setProgress, get: function (k) { return progress[k]; } };

  function subjectById(id) { return S.subjects.filter(function (s) { return s.id === id; })[0]; }

  /* ---------- kvíz (leckékhez és modellekhez is) ---------- */
  S.renderQuiz = function (box, quiz, key) {
    var order = S.shuffle(quiz);
    var i = 0, score = 0;
    function show() {
      if (i >= order.length) return finish();
      var q = order[i];
      var opts = S.shuffle(q.options.map(function (t, k) { return { t: t, ok: k === q.answer }; }));
      box.innerHTML =
        '<div class="progress">' + (i + 1) + ' / ' + order.length + ' kérdés</div>' +
        '<div class="q">' + S.inline(q.q) + '</div>' +
        '<div class="opts">' + opts.map(function (o, k) {
          return '<button type="button" class="opt" data-k="' + k + '">' + S.inline(o.t) + '</button>';
        }).join('') + '</div><div class="after"></div>';
      box.querySelectorAll('.opt').forEach(function (b) {
        b.addEventListener('click', function () {
          var picked = opts[+b.dataset.k];
          if (picked.ok) score++;
          box.querySelectorAll('.opt').forEach(function (x) {
            x.disabled = true;
            if (opts[+x.dataset.k].ok) x.classList.add('right');
          });
          if (!picked.ok) b.classList.add('wrong');
          box.querySelector('.after').innerHTML =
            '<div class="explain"><b>' + (picked.ok ? '✔ Helyes!' : '✘ Nem egészen.') + '</b> ' + S.inline(q.explain || '') + '</div>' +
            '<div class="row" style="margin-top:12px"><button type="button" class="btn primary next">' +
            (i + 1 < order.length ? 'Következő kérdés →' : 'Eredmény') + '</button></div>';
          var nx = box.querySelector('.next');
          nx.addEventListener('click', function () { i++; show(); });
          nx.focus();
        });
      });
    }
    function finish() {
      var pct = Math.round(score / order.length * 100);
      var best = 0;
      if (key) {
        var p = progress[key] || {};
        best = Math.max(p.quizBest || 0, pct);
        setProgress(key, { quizBest: best });
      }
      var msg = pct === 100 ? 'Hibátlan! Mehetsz tovább.' : pct >= 70 ? 'Szép munka! Egy kis ismétlés és meglesz a 100%.' : 'Érdemes még egyszer átolvasni a leckét, aztán újra próbálni.';
      box.innerHTML = '<div class="score">' + score + ' / ' + order.length + '</div><p>' + msg + '</p>' +
        (key ? '<p class="muted">Legjobb eredményed: ' + best + '%</p>' : '') +
        '<button type="button" class="btn retry">↻ Újra</button>';
      box.querySelector('.retry').addEventListener('click', function () { order = S.shuffle(quiz); i = 0; score = 0; show(); });
    }
    show();
  };

  /* ---------- widget beillesztése ---------- */
  function mountWidgets(root) {
    root.querySelectorAll('[data-widget]').forEach(function (el) {
      var spec = JSON.parse(el.dataset.widget);
      var fn = S.widgets[spec.type];
      if (!fn) { el.innerHTML = '<p class="muted">Ismeretlen interaktív elem: ' + esc(spec.type) + '</p>'; return; }
      try { fn(el, spec.options || {}); }
      catch (e) { el.innerHTML = '<p class="muted">Hiba az interaktív elem betöltésekor.</p>'; if (window.console) console.error(e); }
    });
  }
  S.mountWidgets = mountWidgets;
  function widgetSlot(w) { return '<div class="widget card" data-widget="' + esc(JSON.stringify(w)) + '"></div>'; }

  /* ---------- oldalak ---------- */
  function setNav(which) {
    document.querySelectorAll('[data-nav]').forEach(function (a) { a.classList.toggle('active', a.dataset.nav === which); });
  }
  function title(t) { document.title = t ? t + ' – Tudásműhely' : 'Tudásműhely – interaktív tanulás'; }

  function pageHome() {
    setNav('home'); title('');
    var last = S.store.get('last', null);
    var lastHtml = '';
    if (last) {
      var ls = subjectById(last.s);
      var ll = ls && ls.lessons.filter(function (l) { return l.id === last.l; })[0];
      if (ll) lastHtml = '<a class="card tile" style="--tile:' + ls.color + ';margin-top:20px;flex-direction:row;align-items:center" href="#/lecke/' + ls.id + '/' + ll.id + '">' +
        '<span class="ico">' + ls.icon + '</span><span><small class="muted">Folytasd, ahol abbahagytad</small><h3 style="margin:0">' + esc(ll.title) + '</h3><p>' + esc(ls.title) + '</p></span></a>';
    }
    var models = Object.keys(S.models).map(function (k) { return S.models[k]; });
    main.innerHTML =
      '<section class="hero"><h1>Tanulj bármit, a saját tempódban.</h1>' +
      '<p class="lead">Interaktív leckék, kísérletek és kvízek, és egy felfedező, ami alkatrészeire szedve mutatja meg, mi miből áll és hogyan készül. Letöltés után internet nélkül is működik.</p>' +
      '<form class="search-big" id="hero-search"><input type="search" name="q" placeholder="Mi érdekel? pl. processzor, atom, Ohm-törvény…" aria-label="Keresés"><button class="btn primary" type="submit">Keresés</button></form>' +
      '<div class="chips">' + ['processzor', 'atom', 'akkumulátor', 'Ohm', 'FI relé', 'Pitagorasz', 'négyütemű motor', 'honfoglalás'].map(function (c) {
        return '<a class="chip" href="#/kereses?q=' + encodeURIComponent(c) + '">' + esc(c) + '</a>';
      }).join('') + '</div>' + lastHtml + '</section>' +
      '<div class="section-title"><h2>Tantárgyak és szakmák</h2><span class="muted">' + S.subjects.length + ' terület</span></div>' +
      '<div class="grid">' + S.subjects.map(function (s) {
        var st = subjectStats(s);
        return '<a class="card tile" style="--tile:' + s.color + '" href="#/tantargy/' + s.id + '">' +
          '<span class="ico">' + s.icon + '</span><h3>' + esc(s.title) + '</h3><p>' + esc(s.description) + '</p>' +
          '<span class="meta">' + st.total + ' lecke · ' + st.done + ' kész</span><span class="bar"><i style="width:' + st.pct + '%"></i></span></a>';
      }).join('') + '</div>' +
      '<div class="section-title"><h2>Mi miből áll?</h2><a href="#/felfedezo">Összes →</a></div>' +
      '<p class="muted" style="margin-top:-6px">Szedd szét, kattints rá, nézz bele. Minden alkatrésznél megtudod, mi az, miből van és hogyan gyártják.</p>' +
      '<div class="grid">' + models.slice(0, 4).map(modelTile).join('') + '</div>' +
      ((S.courses || []).length ? '<a class="card uni-band" href="#/egyetem" style="text-decoration:none;color:inherit"><span class="ico">🎓</span><span><h2 style="margin:0">Egyetemistáknak</h2>' +
        '<span class="muted">Szakszótár ábrákkal és angol megfelelővel, kattintható képletek, fogalomtérkép és tanulókártyák: ' +
        S.courses.map(function (c) { return esc(c.title); }).join(', ') + '.</span></span><span class="btn primary">Megnyitás →</span></a>' : '');
    main.querySelector('#hero-search').addEventListener('submit', function (e) {
      e.preventDefault();
      var q = e.target.q.value.trim();
      if (q) location.hash = '#/kereses?q=' + encodeURIComponent(q);
    });
  }

  function modelTile(m) {
    return '<a class="card tile" style="--tile:' + (m.color || '#2357d9') + '" href="#/felfedezo/' + m.id + '">' +
      '<span class="ico">' + m.icon + '</span><h3>' + esc(m.title) + '</h3><p>' + esc(m.summary) + '</p>' +
      '<span class="meta">' + m.parts.length + ' alkatrész · ' + (m.steps ? m.steps.length + ' gyártási lépés' : '') + '</span></a>';
  }

  function pageSubject(id) {
    var s = subjectById(id);
    if (!s) return notFound();
    setNav('home'); title(s.title);
    var st = subjectStats(s);
    main.innerHTML =
      '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><span>' + esc(s.title) + '</span></nav>' +
      '<div class="subject-head" style="--tile:' + s.color + '"><span class="ico">' + s.icon + '</span><div><h1>' + esc(s.title) + '</h1>' +
      '<p class="lead" style="margin:0">' + esc(s.description) + '</p></div></div>' +
      (s.intro ? '<div class="lesson-body">' + md(s.intro) + '</div>' : '') +
      '<div class="row" style="--tile:' + s.color + ';margin-top:10px"><span class="muted">' + st.done + ' / ' + st.total + ' lecke kész</span><span class="bar" style="flex:1;max-width:260px"><i style="width:' + st.pct + '%"></i></span></div>' +
      '<div class="row" style="margin-top:14px"><a class="btn primary" href="#/teszt?targy=' + s.id + '">📝 Teszt ebből a tantárgyból</a></div>' +
      '<ol class="lesson-list" style="--tile:' + s.color + '">' + s.lessons.map(function (l, i) {
        var d = isDone(s.id, l.id), lv = LEVELS[l.level || 1];
        var p = progress[lessonKey(s.id, l.id)];
        return '<li><a class="card" href="#/lecke/' + s.id + '/' + l.id + '"><span class="num' + (d ? ' done' : '') + '">' + (d ? '✓' : i + 1) + '</span>' +
          '<span class="txt"><b>' + esc(l.title) + '</b><span>' + esc(l.summary) + '</span></span>' +
          '<span class="row" style="flex:none;gap:6px"><span class="badge ' + lv[1] + '">' + lv[0] + '</span>' +
          (p && p.quizBest != null ? '<span class="badge">kvíz ' + p.quizBest + '%</span>' : '') + '</span></a></li>';
      }).join('') + '</ol>';
  }

  function pageLesson(sid, lid) {
    var s = subjectById(sid);
    var idx = s ? s.lessons.findIndex(function (l) { return l.id === lid; }) : -1;
    if (idx < 0) return notFound();
    var l = s.lessons[idx], key = lessonKey(sid, lid), lv = LEVELS[l.level || 1];
    setNav('home'); title(l.title);
    S.store.set('last', { s: sid, l: lid });
    var prev = s.lessons[idx - 1], next = s.lessons[idx + 1];
    var secs = l.sections || [];
    var body = secs.map(function (sec, i) {
      return '<section id="sec-' + i + '">' + (sec.title ? '<h2>' + esc(sec.title) + '</h2>' : '') + md(sec.text) +
        (sec.tip ? '<div class="note tip"><b class="t">Jó tudni</b>' + md(sec.tip) + '</div>' : '') +
        (sec.warn ? '<div class="note warn"><b class="t">⚠ Figyelem</b>' + md(sec.warn) + '</div>' : '') +
        (sec.widget ? widgetSlot(sec.widget) : '') + '</section>';
    }).join('');
    var widgets = (l.widgets || []).map(widgetSlot).join('');
    var models = (l.models || []).filter(function (m) { return S.models[m]; });
    main.innerHTML =
      '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><a href="#/tantargy/' + s.id + '">' + esc(s.title) + '</a><span>›</span><span>' + (idx + 1) + '. lecke</span></nav>' +
      '<div class="lesson"><article class="lesson-body">' +
      '<div class="row" style="gap:8px;margin-bottom:6px"><span class="badge ' + lv[1] + '">' + lv[0] + '</span>' + (l.minutes ? '<span class="badge">⏱ kb. ' + l.minutes + ' perc</span>' : '') + '</div>' +
      '<h1>' + esc(l.title) + '</h1><p class="lead">' + esc(l.summary) + '</p>' +
      body + widgets +
      (models.length ? '<h2>Nézz bele!</h2><p class="muted">Ehhez a leckéhez kapcsolódó szétszedhető modellek:</p><div class="related">' + models.map(function (m) {
        return '<a class="btn" href="#/felfedezo/' + m + '">' + S.models[m].icon + ' ' + esc(S.models[m].title) + '</a>';
      }).join('') + '</div>' : '') +
      uniBox(s, l) +
      (l.quiz && l.quiz.length ? '<h2 id="kviz">Ellenőrizd magad!</h2><div class="quiz card" id="quiz"></div>' : '') +
      '<div class="row" style="margin-top:22px"><button type="button" class="btn" id="done"></button></div>' +
      '<nav class="pager">' + (prev ? '<a class="btn" href="#/lecke/' + s.id + '/' + prev.id + '">← ' + esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a class="btn primary" href="#/lecke/' + s.id + '/' + next.id + '">' + esc(next.title) + ' →</a>' : '<a class="btn" href="#/tantargy/' + s.id + '">Vissza a tantárgyhoz</a>') + '</nav>' +
      '</article><aside class="toc card pad"><b>Tartalom</b><ol>' + secs.map(function (sec, i) {
        return sec.title ? '<li><a href="#sec-' + i + '" data-jump="sec-' + i + '">' + esc(sec.title) + '</a></li>' : '';
      }).join('') + (l.quiz ? '<li><a href="#kviz" data-jump="kviz">Kvíz</a></li>' : '') + '</ol></aside></div>';

    var doneBtn = main.querySelector('#done');
    function paintDone() {
      var d = isDone(sid, lid);
      doneBtn.textContent = d ? '✓ Megtanultam (visszavonás)' : 'Megjelölöm: megtanultam';
      doneBtn.classList.toggle('on', d);
    }
    doneBtn.addEventListener('click', function () { setProgress(key, { done: !isDone(sid, lid) }); paintDone(); });
    paintDone();
    // A tartalomjegyzék ugrásai ne írják át az útvonalat.
    main.querySelectorAll('[data-jump]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var t = document.getElementById(a.dataset.jump);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
    mountWidgets(main);
    if (l.quiz && l.quiz.length) S.renderQuiz(main.querySelector('#quiz'), l.quiz, key);
  }

  /* Egyetemi kitekintés a lecke végén: a lecke saját hivatkozásai + azok a szakszavak, amelyek erre a leckére épülnek. */
  function uniBox(s, l) {
    if (!S.termCards) return '';
    var refs = (l.terms || []).concat(S.termsBuildingOn(s.id, l.id)).filter(function (r, i, a) { return a.indexOf(r) === i && S.resolveTerm(r); });
    if (!refs.length) return '';
    if (S.level !== 'egyetem') {
      return '<div class="note uni-hint"><b class="t">🎓 Egyetemi kitekintés</b><p>' + refs.length + ' egyetemi szakszó épül erre a leckére (pl. ' +
        refs.slice(0, 3).map(function (r) { var x = S.resolveTerm(r); return '<a href="' + x.href + '">' + esc(x.t.term) + '</a>'; }).join(', ') +
        '). <button type="button" class="linkish" data-level="egyetem">Váltás egyetemi szintre</button></p></div>';
    }
    return '<h2>🎓 Egyetemi kitekintés</h2><p class="muted">Ugyanez a téma mélyebben, a pontos szakszavakkal és angol megfelelőjükkel:</p>' + S.termCards(refs);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-level]');
    if (b && b.tagName === 'BUTTON') S.setLevel(b.dataset.level);
  });

  function pageExplorerList() {
    setNav('felfedezo'); title('Mi miből áll?');
    var models = Object.keys(S.models).map(function (k) { return S.models[k]; });
    var cats = {};
    models.forEach(function (m) { (cats[m.category || 'Egyéb'] = cats[m.category || 'Egyéb'] || []).push(m); });
    var chains = S.chains || [];
    main.innerHTML =
      '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><span>Mi miből áll?</span></nav>' +
      '<h1>Mi miből áll?</h1><p class="lead">Válassz egy tárgyat, szedd szét, és kattints az alkatrészeire. Ahol egy alkatrész mellett „Nézz bele” gomb van, ott egy szinttel lejjebb is mehetsz, egészen az atomokig.</p>' +
      (chains.length ? '<div class="card pad" style="margin:16px 0"><b>Utazás a mélybe</b>' + chains.map(function (c) {
        return '<div class="chain">' + c.map(function (id, i) {
          var m = S.models[id]; if (!m) return '';
          return (i ? '<span class="arrow">→</span>' : '') + '<a class="chip" href="#/felfedezo/' + c.slice(0, i + 1).join('/') + '">' + m.icon + ' ' + esc(m.title) + '</a>';
        }).join('') + '</div>';
      }).join('') + '</div>' : '') +
      Object.keys(cats).map(function (c) {
        return '<div class="section-title"><h2>' + esc(c) + '</h2></div><div class="grid">' + cats[c].map(modelTile).join('') + '</div>';
      }).join('');
  }

  function pageExplorer(ids) {
    var m = S.models[ids[ids.length - 1]];
    if (!m) return notFound();
    setNav('felfedezo'); title(m.title);
    S.renderModel(main, m, ids);
  }

  /* ---------- keresés ---------- */
  var index = null;
  function buildIndex() {
    index = [];
    S.subjects.forEach(function (s) {
      index.push({ kind: 'Tantárgy', icon: s.icon, title: s.title, sub: s.description, href: '#/tantargy/' + s.id, text: s.description + ' ' + (s.intro || '') });
      s.lessons.forEach(function (l) {
        var txt = [l.summary, (l.tags || []).join(' ')].concat((l.sections || []).map(function (x) { return (x.title || '') + ' ' + (x.text || '') + ' ' + (x.tip || '') + ' ' + (x.warn || ''); })).join(' ');
        index.push({ kind: 'Lecke', icon: s.icon, title: l.title, sub: s.title + ' · ' + l.summary, href: '#/lecke/' + s.id + '/' + l.id, text: txt, tags: (l.tags || []).join(' ') });
      });
    });
    Object.keys(S.models).forEach(function (k) {
      var m = S.models[k];
      index.push({ kind: 'Felfedező', icon: m.icon, title: m.title, sub: m.summary, href: '#/felfedezo/' + m.id, text: m.summary + ' ' + (m.intro || '') + ' ' + (m.keywords || ''), tags: m.keywords || '' });
      m.parts.forEach(function (p) {
        index.push({ kind: 'Alkatrész', icon: m.icon, title: p.name, sub: m.title + ' · ' + p.what, href: '#/felfedezo/' + m.id + '?resz=' + p.id, text: [p.what, p.madeOf, p.how, p.fact].join(' ') });
      });
    });
    (S.courses || []).forEach(function (c) {
      index.push({ kind: 'Egyetem', icon: c.icon, title: c.title, sub: c.description, href: '#/egyetem/' + c.id, text: c.description + ' ' + (c.intro || '') });
      c.terms.forEach(function (t) {
        index.push({ kind: 'Szakszó', icon: c.icon, title: t.term, sub: c.title + ' · ' + t.short, href: '#/egyetem/' + c.id + '/fogalom/' + t.id,
          text: [t.short, t.text, t.example, t.pitfall].join(' '), tags: (t.en || '') + ' ' + (t.tags || '') });
      });
    });
    index.forEach(function (it) { it.nt = norm(it.title); it.nx = norm(it.text); it.ng = norm(it.tags || ''); });
  }
  function search(q) {
    if (!index) buildIndex();
    var terms = norm(q).split(/\s+/).filter(function (t) { return t.length > 0; });
    if (!terms.length) return [];
    var out = [];
    index.forEach(function (it) {
      var sc = 0;
      for (var i = 0; i < terms.length; i++) {
        var t = terms[i], s = 0;
        if (it.nt === t) s += 40;
        if (it.nt.indexOf(t) === 0) s += 20;
        if (it.nt.indexOf(t) >= 0) s += 15;
        if (it.ng.indexOf(t) >= 0) s += 8;
        if (it.nx.indexOf(t) >= 0) s += 3;
        if (!s) return; // minden szónak szerepelnie kell
        sc += s;
      }
      if (it.kind === 'Lecke' || it.kind === 'Felfedező' || it.kind === 'Szakszó') sc += 2;
      out.push({ it: it, sc: sc });
    });
    out.sort(function (a, b) { return b.sc - a.sc; });
    return out.map(function (o) { return o.it; });
  }
  function mark(text, q) {
    var t = esc(text);
    norm(q).split(/\s+/).filter(Boolean).forEach(function (w) {
      // ékezetfüggetlen kiemelés: a normalizált szövegben keresünk, az eredetiben jelölünk
      var src = norm(t), i = src.indexOf(w);
      if (i >= 0 && w.length > 1) t = t.slice(0, i) + '<mark>' + t.slice(i, i + w.length) + '</mark>' + t.slice(i + w.length);
    });
    return t;
  }
  function resultRow(it, q, hi) {
    return '<a class="sr' + (hi ? ' hi' : '') + '" href="' + it.href + '"><span class="ico">' + it.icon + '</span><span class="t"><b>' + mark(it.title, q) + '</b><span>' + esc(it.sub) + '</span></span><span class="badge kind">' + it.kind + '</span></a>';
  }
  function pageSearch(q) {
    setNav(''); title('Keresés: ' + q);
    var res = search(q);
    main.innerHTML = '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><span>Keresés</span></nav>' +
      '<h1>Keresés: „' + esc(q) + '”</h1><p class="muted">' + res.length + ' találat</p>' +
      (res.length ? '<div class="card results">' + res.slice(0, 60).map(function (it) { return resultRow(it, q); }).join('') + '</div>'
        : '<div class="card empty"><p>Erre még nincs tananyag.</p><p>Próbáld másképp: rövidebb szóval, vagy nézz körül a <a href="#/">tantárgyak</a> és a <a href="#/felfedezo">felfedező</a> között.</p></div>');
    var input = document.getElementById('search');
    if (document.activeElement !== input) input.value = q;
  }

  function pageAbout() {
    setNav(''); title('Letöltés és használat');
    main.innerHTML = '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><span>Letöltés</span></nav>' +
      '<article class="lesson-body"><h1>Hogyan töltsem le és használjam?</h1>' + md(
        'A Tudásműhely egy egyszerű weboldal, ami **teljesen a saját gépeden fut**: nem kell hozzá internet, regisztráció vagy telepítés.\n\n' +
        '**1. lehetőség: egyetlen fájl.** Töltsd le a `tudasmuhely-offline.html` fájlt (a `dist` mappában található), és nyisd meg dupla kattintással bármilyen böngészőben. Pendrive-ra is másolható, e-mailben is elküldhető.\n\n' +
        '**2. lehetőség: a teljes mappa.** Töltsd le a projektet ZIP-ként (GitHubon: Code → Download ZIP), csomagold ki, és nyisd meg az `index.html` fájlt.\n\n' +
        '**3. lehetőség: telepítés alkalmazásként.** Ha a tananyag egy weboldalon van közzétéve (például az iskola szerverén), a böngésző menüjében válaszd a „Telepítés” vagy „Hozzáadás a kezdőképernyőhöz” lehetőséget. Az első megnyitás után offline is működik, telefonon is.\n\n' +
        'A haladásod (elvégzett leckék, kvízeredmények) a böngésződben tárolódik ezen az eszközön. Ha másik gépre ülsz, ott elölről indul.\n\n' +
        'A tananyag bővíthető: minden tantárgy és modell egy-egy külön fájl a `data` mappában. A leírás a `README.md` fájlban van.') +
      '<div class="row" style="margin-top:12px"><button class="btn" id="reset" type="button">Haladás törlése ezen az eszközön</button></div></article>';
    main.querySelector('#reset').addEventListener('click', function () {
      if (confirm('Biztosan törlöd az összes elvégzett leckét és kvízeredményt?')) {
        progress = {}; S.store.set('progress', progress); S.store.set('last', null); location.hash = '#/';
      }
    });
  }

  function notFound() {
    title('Nem található');
    main.innerHTML = '<div class="empty card"><h1>Ezt nem találjuk</h1><p>Lehet, hogy elírás van a címben.</p><a class="btn primary" href="#/">Vissza a kezdőlapra</a></div>';
  }

  /* ---------- útválasztó ---------- */
  var lastPath = null;
  function route() {
    var h = location.hash.slice(1) || '/';
    if (h.indexOf('/') !== 0) return; // pl. #sec-1 belső ugrás
    var qi = h.indexOf('?');
    var path = qi >= 0 ? h.slice(0, qi) : h;
    var params = {};
    if (qi >= 0) h.slice(qi + 1).split('&').forEach(function (kv) {
      var p = kv.split('='); params[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    var seg = path.split('/').filter(Boolean).map(decodeURIComponent);
    S.params = params;
    document.body.setAttribute('data-page', seg[0] || 'home');
    closePop();
    if (!seg.length) pageHome();
    else if (seg[0] === 'tantargy') pageSubject(seg[1]);
    else if (seg[0] === 'lecke') pageLesson(seg[1], seg[2]);
    else if (seg[0] === 'felfedezo' && seg.length === 1) pageExplorerList();
    else if (seg[0] === 'felfedezo') pageExplorer(seg.slice(1));
    else if (seg[0] === 'egyetem' && seg.length === 1) { setNav('egyetem'); title('Egyetem'); S.pageUniList(main); }
    else if (seg[0] === 'egyetem' && seg[2] === 'fogalom') { setNav('egyetem'); var tt = S.courseById(seg[1]); title(tt ? tt.title : ''); if (!S.pageTerm(main, seg[1], seg[3])) notFound(); }
    else if (seg[0] === 'egyetem') { setNav('egyetem'); var cc = S.courseById(seg[1]); title(cc ? cc.title : ''); if (!S.pageCourse(main, seg[1], seg[2])) notFound(); }
    else if (seg[0] === 'teszt') { setNav('teszt'); title('Tesztközpont'); S.pageTeszt(main, params); }
    else if (seg[0] === 'kereses') pageSearch(params.q || '');
    else if (seg[0] === 'nevjegy') pageAbout();
    else notFound();
    if (path !== lastPath) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
    lastPath = path;
  }

  /* ---------- fejléc keresője ---------- */
  var input = document.getElementById('search');
  var pop = document.getElementById('search-pop');
  var hi = -1, cur = [];
  function closePop() { pop.hidden = true; hi = -1; }
  function paintPop() {
    var q = input.value.trim();
    if (!q) return closePop();
    cur = search(q).slice(0, 8);
    pop.innerHTML = cur.length ? cur.map(function (it, i) { return resultRow(it, q, i === hi); }).join('') +
      '<a class="sr" href="#/kereses?q=' + encodeURIComponent(q) + '"><span class="ico">🔎</span><span class="t"><b>Összes találat</b></span></a>'
      : '<div class="empty" style="padding:14px">Nincs találat erre: „' + esc(q) + '”</div>';
    pop.hidden = false;
  }
  input.addEventListener('input', function () { hi = -1; paintPop(); });
  input.addEventListener('focus', paintPop);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { hi = Math.min(hi + 1, cur.length - 1); paintPop(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { hi = Math.max(hi - 1, -1); paintPop(); e.preventDefault(); }
    else if (e.key === 'Escape') { closePop(); input.blur(); }
    else if (e.key === 'Enter') {
      var q = input.value.trim();
      if (hi >= 0 && cur[hi]) location.hash = cur[hi].href;
      else if (q) location.hash = '#/kereses?q=' + encodeURIComponent(q);
      closePop(); input.blur();
    }
  });
  document.addEventListener('click', function (e) { if (!e.target.closest('.search')) closePop(); });
  pop.addEventListener('click', function () { closePop(); input.blur(); });

  /* ---------- mélységi szint: iskolai / egyetemi ---------- */
  S.level = S.store.get('level', 'iskolai');
  var levelBtn = document.getElementById('level');
  function paintLevel() {
    levelBtn.innerHTML = S.level === 'egyetem' ? '🎓 <span>Egyetemi</span>' : '🎒 <span>Iskolai</span>';
    levelBtn.title = 'Mélységi szint: ' + (S.level === 'egyetem' ? 'egyetemi (elmélet, képletek, angol szakszavak)' : 'iskolai és szakmai') + '. Kattints a váltáshoz!';
    document.documentElement.setAttribute('data-level', S.level);
  }
  S.setLevel = function (lv) {
    S.level = lv; S.store.set('level', lv); paintLevel();
    var y = window.scrollY; route(); window.scrollTo(0, y);
  };
  levelBtn.addEventListener('click', function () { S.setLevel(S.level === 'egyetem' ? 'iskolai' : 'egyetem'); });
  paintLevel();

  /* ---------- téma ---------- */
  var theme = S.store.get('theme', null);
  if (theme) document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('theme').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    theme = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    S.store.set('theme', theme);
  });

  /* ---------- offline mód (csak webszerverről futtatva) ---------- */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }

  window.addEventListener('hashchange', route);
  route();
})();

</script>
</body>
</html>
