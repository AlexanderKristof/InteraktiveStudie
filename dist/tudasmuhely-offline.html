<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tudásműhely – interaktív tanulás</title>
  <meta name="description" content="Ingyenes, offline is működő interaktív tananyag: villanyszerelés, autószerelés, elektromos autók, matematika, történelem, fizika, és a „Mi miből áll?” felfedező.">
  <meta name="theme-color" content="#2357d9">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20512%20512%22%3E%0A%20%20%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22112%22%20fill%3D%22%232357d9%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M256%2092%20L408%20256%20L256%20420%20L104%20256%20Z%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M256%20160%20L340%20256%20L256%20352%20L172%20256%20Z%22%20fill%3D%22%232357d9%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22256%22%20cy%3D%22256%22%20r%3D%2234%22%20fill%3D%22%23ffd54a%22%2F%3E%0A%3C%2Fsvg%3E%0A">
  <style>
/* Tudásműhely – stíluslap. Csak rendszerbetűk, nincs külső függőség (offline). */
:root {
  --bg: #f6f7fb;
  --surface: #ffffff;
  --surface-2: #eef1f8;
  --fg: #172033;
  --fg-2: #4b5670;
  --muted: #7a849b;
  --line: #dde2ee;
  --accent: #2357d9;
  --accent-fg: #ffffff;
  --accent-soft: #e3ebff;
  --ok: #138a4c;
  --ok-soft: #dcf5e7;
  --bad: #c22f3a;
  --bad-soft: #fde3e5;
  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --stage: #f1f4fa;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 14px rgba(20, 30, 60, .06);
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Code", "Consolas", "DejaVu Sans Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1420; --surface: #171e2d; --surface-2: #1f2839; --fg: #e8ecf5; --fg-2: #b4bdd1;
    --muted: #8a94ab; --line: #2b3549; --accent: #6f9bff; --accent-fg: #0b1222; --accent-soft: #1c2a4a;
    --ok: #4cd98b; --ok-soft: #12321f; --bad: #ff7a84; --bad-soft: #3a1a1e; --warn: #ffc25c; --warn-soft: #33260f;
    --stage: #121a28; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #171e2d; --surface-2: #1f2839; --fg: #e8ecf5; --fg-2: #b4bdd1;
  --muted: #8a94ab; --line: #2b3549; --accent: #6f9bff; --accent-fg: #0b1222; --accent-soft: #1c2a4a;
  --ok: #4cd98b; --ok-soft: #12321f; --bad: #ff7a84; --bad-soft: #3a1a1e; --warn: #ffc25c; --warn-soft: #33260f;
  --stage: #121a28; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 var(--font);
  min-height: 100vh; display: flex; flex-direction: column;
}
a { color: var(--accent); }
a:hover { text-decoration-thickness: 2px; }
code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: .1em .35em; border-radius: 5px; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: clamp(1.6rem, 4vw, 2.3rem); letter-spacing: -.01em; }
h2 { font-size: 1.35rem; margin-top: 1.6em; }
h3 { font-size: 1.1rem; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.skip { position: absolute; left: -999px; top: 0; background: var(--accent); color: var(--accent-fg); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }

/* Fejléc */
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px;
  padding: 10px max(16px, calc((100vw - 1200px) / 2)); background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--fg); font-weight: 750; font-size: 1.1rem; white-space: nowrap; }
.brand-mark { color: var(--accent); font-size: 1.2rem; }
.topnav { display: flex; gap: 4px; }
.topnav a { text-decoration: none; color: var(--fg-2); padding: 6px 10px; border-radius: 8px; white-space: nowrap; }
.topnav a:hover { background: var(--surface-2); }
.topnav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.search { position: relative; flex: 1; min-width: 0; }
.search input {
  width: 100%; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface-2); outline: none;
}
.search input:focus { border-color: var(--accent); background: var(--surface); }
.search-pop {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); padding: 6px; max-height: 70vh; overflow: auto;
}
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--surface-2); }

main:focus { outline: none; }
main { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; outline: none; }
.foot { text-align: center; color: var(--muted); font-size: .9rem; padding: 18px 16px 28px; border-top: 1px solid var(--line); }

/* Általános elemek */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 20px; }
.muted { color: var(--muted); }
.lead { font-size: 1.1rem; color: var(--fg-2); max-width: 70ch; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; text-decoration: none; color: var(--fg); font-weight: 550;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.crumbs { font-size: .92rem; color: var(--muted); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { color: var(--fg-2); text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.badge { display: inline-block; font-size: .78rem; font-weight: 650; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--fg-2); }
.badge.l1 { background: var(--ok-soft); color: var(--ok); }
.badge.l2 { background: var(--warn-soft); color: var(--warn); }
.badge.l3 { background: var(--bad-soft); color: var(--bad); }
.badge.done { background: var(--ok); color: #fff; }

/* Kezdőlap */
.hero { padding: 28px 0 8px; }
.hero h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); }
.hero .search-big { display: flex; gap: 8px; margin-top: 18px; max-width: 640px; }
.hero .search-big input { flex: 1; min-width: 0; padding: 13px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 1.05rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 5px 12px; border-radius: 999px; cursor: pointer; text-decoration: none; color: var(--fg-2); font-size: .92rem; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.tile { display: flex; flex-direction: column; gap: 8px; padding: 18px; text-decoration: none; color: var(--fg); position: relative; overflow: hidden; transition: transform .15s, border-color .15s; }
.tile:hover { transform: translateY(-2px); border-color: var(--tile, var(--accent)); }
.tile .ico { font-size: 1.9rem; width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; background: color-mix(in srgb, var(--tile, var(--accent)) 16%, transparent); }
.tile h3 { margin: 4px 0 0; }
.tile p { margin: 0; color: var(--fg-2); font-size: .95rem; }
.tile .meta { margin-top: auto; font-size: .85rem; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--tile, var(--accent)); border-radius: 99px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 36px 0 14px; }
.section-title h2 { margin: 0; }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0 0; }
.chain a { text-decoration: none; }
.chain .arrow { color: var(--muted); }

/* Tantárgy */
.subject-head { display: flex; gap: 18px; align-items: center; margin-bottom: 8px; }
.subject-head .ico { font-size: 2.4rem; width: 72px; height: 72px; display: grid; place-items: center; border-radius: 18px; background: color-mix(in srgb, var(--tile, var(--accent)) 16%, transparent); flex: none; }
.lesson-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
.lesson-list a { display: flex; gap: 14px; align-items: center; padding: 14px 16px; text-decoration: none; color: var(--fg); }
.lesson-list a:hover { border-color: var(--tile, var(--accent)); }
.lesson-list .num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-weight: 700; color: var(--fg-2); }
.lesson-list .num.done { background: var(--ok); color: #fff; }
.lesson-list .txt { flex: 1; min-width: 0; }
.lesson-list .txt b { display: block; }
.lesson-list .txt span { color: var(--fg-2); font-size: .93rem; }

/* Lecke */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; align-items: start; }
.lesson-body { min-width: 0; }
.lesson-body section { margin-bottom: 8px; }
.lesson-body p, .lesson-body li { max-width: 72ch; }
.toc { position: sticky; top: 76px; font-size: .92rem; }
.toc ol { padding-left: 20px; margin: 8px 0; }
.toc a { color: var(--fg-2); text-decoration: none; }
.toc a:hover { color: var(--accent); }
.note { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 8px; margin: 12px 0; max-width: 72ch; }
.note.warn { border-color: var(--bad); background: var(--bad-soft); }
.note.tip { border-color: var(--ok); background: var(--ok-soft); }
.note p { margin: 0; }
.note b.t { display: block; margin-bottom: 2px; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; flex-wrap: wrap; }
.related { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }

/* Kvíz */
.quiz { padding: 20px; margin-top: 12px; }
.quiz .q { font-weight: 650; font-size: 1.05rem; margin: 6px 0 12px; }
.quiz .opts { display: grid; gap: 8px; }
.quiz .opt { text-align: left; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.quiz .opt:hover:not(:disabled) { border-color: var(--accent); }
.quiz .opt.right { background: var(--ok-soft); border-color: var(--ok); color: var(--fg); }
.quiz .opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.quiz .opt:disabled { cursor: default; }
.quiz .explain { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); }
.quiz .progress { font-size: .85rem; color: var(--muted); }
.quiz .score { font-size: 2rem; font-weight: 800; }

/* Interaktív elemek (widgetek) */
.widget { padding: 18px; margin: 18px 0; }
.widget .w-title { font-weight: 700; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.widget .w-title::before { content: "▶"; font-size: .75rem; color: var(--accent); }
.widget .w-help { color: var(--fg-2); font-size: .93rem; margin: 0 0 12px; }
.w-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 18px; align-items: center; }
.w-ctrl { display: grid; gap: 12px; }
.w-ctrl label { display: grid; gap: 2px; font-size: .93rem; }
.w-ctrl label .lv { display: flex; justify-content: space-between; gap: 8px; }
.w-ctrl label .lv b { font-family: var(--mono); color: var(--accent); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.w-out { display: grid; gap: 8px; }
.w-svg { width: 100%; height: auto; background: var(--stage); border-radius: 12px; border: 1px solid var(--line); display: block; }
.w-res { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.w-res div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.w-res small { display: block; color: var(--muted); font-size: .78rem; }
.w-res b { font-family: var(--mono); font-size: 1.05rem; }
.w-formula { font-family: var(--mono); background: var(--surface-2); padding: 8px 12px; border-radius: 10px; font-size: .92rem; overflow-x: auto; }
.w-msg { padding: 8px 12px; border-radius: 10px; font-size: .93rem; }
.w-msg.ok { background: var(--ok-soft); color: var(--ok); }
.w-msg.bad { background: var(--bad-soft); color: var(--bad); }
.w-msg.warn { background: var(--warn-soft); color: var(--warn); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-fg); }
.svg-text:not([fill]) { fill: var(--fg); }
.svg-text { font-family: var(--font); }
.svg-muted:not([fill]) { fill: var(--muted); }
.svg-muted { font-family: var(--font); }
.svg-line { stroke: var(--fg-2); }
.svg-grid { stroke: var(--line); }
.tl { display: flex; gap: 0; overflow-x: auto; padding: 8px 4px 4px; scroll-snap-type: x proximity; }
.tl button { flex: none; scroll-snap-align: start; border: 0; background: none; cursor: pointer; padding: 0 14px 6px; position: relative; text-align: center; min-width: 96px; }
.tl button::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 3px; background: var(--line); }
.tl button i { position: relative; display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); margin: 6px auto 6px; }
.tl button.on i { background: var(--accent); }
.tl button b { display: block; font-family: var(--mono); font-size: .9rem; }
.tl button span { display: block; font-size: .8rem; color: var(--fg-2); max-width: 120px; }
.tl-detail { margin-top: 10px; padding: 12px 14px; background: var(--surface-2); border-radius: 10px; }
.order-game { display: grid; gap: 8px; margin-top: 12px; }
.order-game .pool { display: flex; flex-wrap: wrap; gap: 8px; }
.practice input[type="text"], .practice input[type="number"] { width: 140px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.practice .task { font-family: var(--mono); font-size: 1.3rem; margin: 6px 0 12px; }
.counter { display: flex; align-items: center; gap: 8px; }
.counter button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; }
.counter b { min-width: 36px; text-align: center; font-family: var(--mono); }

/* Felfedező */
.ex-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.ex-stage { padding: 12px; position: relative; }
.ex-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.zoom-btns { display: inline-flex; gap: 4px; }
.zoom-btns .btn { padding: 6px 11px; }
.ex-svg.zoomed { cursor: grab; }
.ex-toolbar .scale { margin-left: auto; font-size: .85rem; color: var(--muted); }
.ex-svg { width: 100%; height: auto; display: block; background: var(--stage); border-radius: 12px; border: 1px solid var(--line); touch-action: manipulation; }
.ex-svg .part { cursor: pointer; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.ex-svg .part:hover { filter: brightness(1.12) drop-shadow(0 0 4px rgba(35, 87, 217, .55)); }
.ex-svg .part:focus { outline: none; }
.ex-svg .part:focus-visible { filter: drop-shadow(0 0 6px var(--accent)); }
.ex-svg.has-sel .part:not(.sel) { opacity: .07; filter: grayscale(1); }
.ex-svg.has-sel .part.sel { filter: drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 10px var(--accent)); }
.ex-svg.has-sel .badge-g:not(.sel) { opacity: 0; }
.ex-svg .badge-g { pointer-events: none; transition: transform .7s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.ex-svg .badge-g circle { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.ex-svg .badge-g text { fill: var(--accent-fg); font: 700 12px var(--font); text-anchor: middle; dominant-baseline: central; }
.ex-svg.no-badges .badge-g { display: none; }
.ex-svg .lbl { fill: var(--fg); font: 600 13px var(--font); }
.ex-svg .lbl-muted { fill: var(--muted); font: 12px var(--font); }
.ex-info { padding: 18px; position: sticky; top: 76px; }
.ex-info h3 { display: flex; gap: 10px; align-items: center; }
.ex-info h3 .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: .85rem; display: grid; place-items: center; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 10px 0 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 10px; cursor: pointer; color: var(--fg-2); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-color: var(--accent); font-weight: 650; }
.fact { background: var(--warn-soft); color: var(--fg); border-radius: 10px; padding: 10px 12px; font-size: .93rem; margin-top: 10px; }
.fact::before { content: "💡 "; }
.part-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.part-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 4px; cursor: pointer; font-size: .88rem; display: inline-flex; align-items: center; gap: 6px; }
.part-chips button i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .75rem; font-weight: 700; }
.part-chips button.on { border-color: var(--accent); color: var(--accent); }
.part-chips button.on i { background: var(--accent); color: var(--accent-fg); }
.steps { padding: 18px; }
.steps .step-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.steps .dots { display: flex; gap: 5px; flex-wrap: wrap; }
.steps .dots button { width: 12px; height: 12px; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.steps .dots button.on { background: var(--accent); }
.steps .dots button.past { background: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.steps .step-body { min-height: 120px; margin: 12px 0; }
.steps .step-body h3 { display: flex; gap: 10px; align-items: baseline; }
.steps .step-body h3 small { color: var(--muted); font-weight: 500; }
.history { list-style: none; padding: 0; margin: 0; position: relative; }
.history li { position: relative; padding: 0 0 16px 26px; max-width: 75ch; }
.history li::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: -8px; width: 2px; background: var(--line); }
.history li:last-child::before { display: none; }
.history li::after { content: ""; position: absolute; left: 0; top: 6px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.history b { font-family: var(--mono); color: var(--accent); margin-right: 6px; }

/* Keresés */
.sr { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; text-decoration: none; color: var(--fg); }
.sr:hover, .sr.hi { background: var(--surface-2); }
.sr .ico { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-size: 1.2rem; }
.sr .t { min-width: 0; flex: 1; }
.sr .t b { display: block; }

  <!-- motor -->
  <script>/* js/core.js */
/* Tudásműhely – mag: regiszter és közös segédfüggvények.
 * Minden tartalomfájl (data/...) ezt használja: STUDIE.addSubject(...), STUDIE.addModel(...).
 * Szándékosan nincs modulrendszer és nincs fetch: így a program egyszerűen
 * megnyitható dupla kattintással (file://) is, internet nélkül. */
(function () {
  'use strict';
  var S = (window.STUDIE = window.STUDIE || {});
  S.subjects = [];
  S.models = {};
  S.widgets = {};

  S.addSubject = function (s) { S.subjects.push(s); };
  S.addModel = function (m) { S.models[m.id] = m; };
  S.addWidget = function (name, fn) { S.widgets[name] = fn; };

  S.esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* Ékezetek nélküli, kisbetűs alak a kereséshez. */
  S.norm = function (s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  };

  /* Magyar számformátum (tizedesvessző). */
  S.fmt = function (n, d) {
    if (!isFinite(n)) return '∞';
    var d0 = d == null ? 2 : d, r = Math.round(n * Math.pow(10, d0)) / Math.pow(10, d0);
    if (r === 0) n = 0; // ne legyen „−0”
    return Number(n).toLocaleString('hu-HU', { maximumFractionDigits: d == null ? 2 : d });
  };

  /* Egyszerű szövegjelölés a tananyagban:
   *   **félkövér**, `képlet`, [[modell-id|link a felfedezőbe]], [[#/útvonal|belső link]]
   *   "- " kezdetű sorok: felsorolás, "1. " kezdetű sorok: számozott lista,
   *   üres sor: új bekezdés. */
  /* Alsó index a folyó szövegben is: U_0, F_g, c_{w}, T_{CPU} (kódrészleten kívül). */
  function subs(t) {
    return t.replace(/(^|[^\w&#\/])([A-Za-zα-ωΑ-Ω])_(?:\{([^}]+)\}|([A-Za-z0-9]{1,4})(?![\w]))/g, function (m, pre, base, a, b) {
      return pre + base + '<sub>' + (a || b) + '</sub>';
    });
  }
  function inline(s) {
    return S.esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .split(/(`[^`]*`)/).map(function (part, i) { return i % 2 ? part : subs(part); }).join('')
      .replace(/`(.+?)`/g, '<code>$1</code>')
      .replace(/\[\[(#[^|\]]+)\|(.+?)\]\]/g, '<a href="$1">$2</a>')
      .replace(/\[\[([\w-]+)\|(.+?)\]\]/g, '<a class="model-link" href="#/felfedezo/$1">$2</a>');
  }
  S.inline = inline;

  S.md = function (text) {
    if (!text) return '';
    return String(text).trim().split(/\n\s*\n/).map(function (block) {
      var lines = block.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
      if (lines.every(function (l) { return /^- /.test(l); })) {
        return '<ul>' + lines.map(function (l) { return '<li>' + inline(l.slice(2)) + '</li>'; }).join('') + '</ul>';
      }
      if (lines.every(function (l) { return /^\d+\. /.test(l); })) {
        return '<ol>' + lines.map(function (l) { return '<li>' + inline(l.replace(/^\d+\. /, '')) + '</li>'; }).join('') + '</ol>';
      }
      return '<p>' + lines.map(inline).join('<br>') + '</p>';
    }).join('');
  };

  /* Böngészőben tárolt haladás. Ha a tárolás nem elérhető, csendben kihagyjuk. */
  S.store = {
    get: function (k, d) {
      try { var v = localStorage.getItem('tudasmuhely.' + k); return v ? JSON.parse(v) : d; }
      catch (e) { return d; }
    },
    set: function (k, v) {
      try { localStorage.setItem('tudasmuhely.' + k, JSON.stringify(v)); } catch (e) { /* nincs tárolás */ }
    }
  };

  /* ---------- rajzsegéd a modellekhez ---------- */
  function shade(hex, f) {
    var h = hex.replace('#', '');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function c(x) { return Math.max(0, Math.min(255, Math.round(f < 1 ? x * f : x + (255 - x) * (f - 1)))); }
    return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
  }
  S.draw = {
    shade: shade,
    /* Izometrikus vetítés. Világkoordináták: x jobbra-le, y balra-le, z felfelé.
     *   var I = STUDIE.draw.iso(300, 220);
     *   I.box(x, y, z, szélesség, mélység, magasság, '#színkód')  -> 3D doboz (teteje + két látható oldala)
     *   I.face(x, y, z, szélesség, mélység, '#szín')              -> vízszintes lap (pl. felirat, minta)
     *   I.pt(x, y, z)                                            -> [képernyő x, képernyő y]
     *   I.cyl(x, y, z, sugár, magasság, '#szín')                  -> álló henger */
    iso: function (ox, oy, k) {
      k = k || 1;
      function pt(x, y, z) { return [ox + (x - y) * 0.866 * k, oy + ((x + y) * 0.5 - (z || 0)) * k]; }
      function poly(pts, fill, extra) {
        return '<polygon points="' + pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ') +
          '" fill="' + fill + '"' + (extra || ' stroke="rgba(0,0,0,.25)" stroke-width="0.8" stroke-linejoin="round"') + '/>';
      }
      return {
        pt: pt,
        poly: poly,
        face: function (x, y, z, w, d, fill, extra) {
          return poly([pt(x, y, z), pt(x + w, y, z), pt(x + w, y + d, z), pt(x, y + d, z)], fill, extra);
        },
        box: function (x, y, z, w, d, h, color, extra) {
          return poly([pt(x, y + d, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x, y + d, z + h)], shade(color, 0.72), extra) +
            poly([pt(x + w, y, z), pt(x + w, y + d, z), pt(x + w, y + d, z + h), pt(x + w, y, z + h)], shade(color, 0.86), extra) +
            poly([pt(x, y, z + h), pt(x + w, y, z + h), pt(x + w, y + d, z + h), pt(x, y + d, z + h)], color, extra);
        },
        cyl: function (x, y, z, r, h, color) {

</script>
  <script>/* js/university.js */
/* Tudásműhely – Egyetem: szakszótár, képlet-boncoló, fogalomtérkép, tanulókártyák.
 * Adat: STUDIE.addCourse({ id, title, icon, color, level, description, topics, terms, formulas }) – lásd data/egyetem/. */
(function () {
  'use strict';
  var S = window.STUDIE, esc = S.esc, md = S.md;
  S.courses = [];

  var PALETTE = ['#2f7bf6', '#e5484d', '#2f9e6a', '#f08c2e', '#7c5cd6', '#0e9aa7', '#c2417a', '#8a6d1f'];
  function topicColor(c, topicId) {

  }
  function topicTitle(c, id) { var t = (c.topics || []).filter(function (x) { return x.id === id; })[0]; return t ? t.title : ''; }
  function termById(c, id) { return c.terms.filter(function (t) { return t.id === id; })[0]; }
  function sortTerms(arr) { return arr.slice().sort(function (a, b) { return a.term.localeCompare(b.term, 'hu'); }); }

  /* Matematikai jelölés: x_1, x_{max}, x^2, x^{n+1}, valamint \alpha jellegű görög betűk nélkül (írj Unicode-ot: α, Δ, ω). */
  function mathHtml(t) {
    return esc(t)
      .replace(/_\{([^}]*)\}/g, '<sub>$1</sub>').replace(/\^\{([^}]*)\}/g, '<sup>$1</sup>')
      .replace(/_([A-Za-z0-9α-ωΑ-Ω]+)/g, '<sub>$1</sub>').replace(/\^([A-Za-z0-9+\-α-ω]+)/g, '<sup>$1</sup>');

  S.resolveTerm = function (ref) {
    var p = String(ref).split('/'), c = S.courseById(p[0]), t = c && termById(c, p[1]);
    return t ? { c: c, t: t, href: '#/egyetem/' + c.id + '/fogalom/' + t.id } : null;

  S.termCards = function (refs, title) {

      return '<a class="tr-card" style="--tc:' + topicColor(r.c, r.t.topic) + '" href="' + r.href + '"><b>' + esc(r.t.term) + '</b>' +
        (r.t.en ? '<small>🇬🇧 ' + esc(r.t.en) + '</small>' : '') + '<span>' + S.inline(r.t.short) + '</span><em>' + esc(r.c.title) + ' →</em></a>';
    }).join('') + '</div></div>';
  };
  /* Hol fordul elő egy szakszó a valóságban? (modellek alkatrészei, leckék) */
  function usages(c, t) {
    var ref = c.id + '/' + t.id, out = [];
    Object.keys(S.models).forEach(function (k) {
      var m = S.models[k];
      if ((m.uni && (m.uni.terms || []).indexOf(ref) >= 0)) out.push({ icon: m.icon, label: m.title, href: '#/felfedezo/' + m.id });
      m.parts.forEach(function (p) {
        if ((p.terms || []).indexOf(ref) >= 0) out.push({ icon: m.icon, label: m.title + ' › ' + p.name, href: '#/felfedezo/' + m.id + '?resz=' + p.id });

    S.subjects.forEach(function (s) {
      s.lessons.forEach(function (l) {

      });
    });
    return out;
  }
  function prereqLinks(t) {
    return (t.prereq || []).map(function (r) {
      var m;
      if ((m = /^lecke:(.+)\/(.+)$/.exec(r))) {
        var s = S.subjects.filter(function (x) { return x.id === m[1]; })[0], l = s && s.lessons.filter(function (x) { return x.id === m[2]; })[0];

      }

      return rt ? { icon: rt.c.icon, label: rt.t.term, href: rt.href } : null;

  }
  /* Szakszavak, amelyek egy leckére mint előismeretre épülnek. */
  S.termsBuildingOn = function (sid, lid) {

    return out;
  };
  function linkList(items) {
    return '<div class="chips" style="margin-top:4px">' + items.map(function (u) { return '<a class="chip" href="' + u.href + '">' + u.icon + ' ' + esc(u.label) + '</a>'; }).join('') + '</div>';
  }

  /* Kétirányú kapcsolatok a fogalmak között (ha A → B, akkor B is látja A-t). */
  function links(c) {

    return c._links;
  }

  /* ---------- képlet-boncoló ---------- */
  function formulaHtml(f, idx) {
    return '<div class="formula card" data-f="' + idx + '"><div class="f-head"><b>' + esc(f.title) + '</b>' + (f.en ? '<span class="badge">' + esc(f.en) + '</span>' : '') + '</div>' +
      '<div class="f-eq" role="group" aria-label="' + esc(f.title) + '">' + f.parts.map(function (p, i) {
        return p.d ? '<button type="button" class="f-tok" data-i="' + i + '" style="--c:' + PALETTE[i % PALETTE.length] + '">' + mathHtml(p.t) + '</button>'
          : '<span class="f-op">' + mathHtml(p.t) + '</span>';
      }).join('') + '</div><div class="f-info"><span class="muted">Kattints a képlet egy jelére: megmutatom, mit jelent.</span></div>' +
      (f.text ? '<div class="f-text">' + md(f.text) + '</div>' : '') +
      (f.example ? '<div class="note tip"><b class="t">Példa</b>' + md(f.example) + '</div>' : '') + '</div>';
  }
  function bindFormulas(root, formulas) {
    root.querySelectorAll('.formula[data-f]').forEach(function (box) {
      var f = formulas[+box.dataset.f];
      box.querySelectorAll('.f-tok').forEach(function (b) {
        b.addEventListener('click', function () {
          var p = f.parts[+b.dataset.i];
          box.querySelectorAll('.f-tok').forEach(function (x) { x.classList.toggle('on', x === b); });
          box.querySelector('.f-info').innerHTML = '<span class="f-sym" style="color:' + PALETTE[+b.dataset.i % PALETTE.length] + '">' + mathHtml(p.t) + '</span>' +
            '<span><b>' + S.inline(p.d) + '</b>' + (p.unit ? ' · mértékegység: <code>' + esc(p.unit) + '</code>' : '') + (p.more ? '<br><span class="muted">' + S.inline(p.more) + '</span>' : '') + '</span>';
        });
      });
    });
  }

  /* ---------- fogalomkártya ---------- */
  function termHtml(c, t, compact) {
    var col = topicColor(c, t.topic);
    var rel = links(c)[t.id] || [];
    var fs = (t.formulas || []).map(function (fid) { return c.formulas.findIndex(function (f) { return f.id === fid; }); }).filter(function (i) { return i >= 0; });
    return '<article class="term" style="--tc:' + col + '">' +
      '<div class="row" style="gap:6px"><span class="topic-chip">' + esc(topicTitle(c, t.topic)) + '</span>' + (t.en ? '<span class="badge" title="angolul">🇬🇧 ' + esc(t.en) + '</span>' : '') + '</div>' +
      '<h' + (compact ? '3' : '1') + ' class="term-title">' + esc(t.term) + '</h' + (compact ? '3' : '1') + '>' +
      '<p class="term-short">' + S.inline(t.short) + '</p>' +
      (t.visual ? '<figure class="term-visual">' + t.visual + (t.caption ? '<figcaption>' + S.inline(t.caption) + '</figcaption>' : '') + '</figure>' : '') +
      (t.text ? md(t.text) : '') +
      fs.map(function (i) { return formulaHtml(c.formulas[i], i); }).join('') +
      (t.widget ? '<div class="widget card" data-widget="' + esc(JSON.stringify(t.widget)) + '"></div>' : '') +
      (t.example ? '<div class="note tip"><b class="t">Példa</b>' + md(t.example) + '</div>' : '') +
      (t.pitfall ? '<div class="note warn"><b class="t">Gyakori hiba</b>' + md(t.pitfall) + '</div>' : '') +
      (rel.length ? '<p class="muted" style="margin-bottom:4px">Kapcsolódó fogalmak:</p><div class="chips" style="margin-top:0">' + rel.map(function (r) {
        var rt = termById(c, r); return '<a class="chip" href="#/egyetem/' + c.id + '/fogalom/' + r + '">' + esc(rt.term) + '</a>';
      }).join('') + '</div>' : '') +
      (!compact && prereqLinks(t).length ? '<div class="note"><b class="t">🎒 Előismeret: ha valami nem világos, ezekkel kezdd</b>' + linkList(prereqLinks(t)) + '</div>' : '') +
      (!compact && usages(c, t).length ? '<div class="note tip"><b class="t">🔧 Hol találkozol vele a valóságban?</b>' + linkList(usages(c, t)) + '</div>' : '') +
      ((t.models || []).filter(function (m) { return S.models[m]; }).length ? '<div class="related" style="margin-top:12px">' + t.models.filter(function (m) { return S.models[m]; }).map(function (m) {
        return '<a class="btn" href="#/felfedezo/' + m + '">' + S.models[m].icon + ' Nézz bele: ' + esc(S.models[m].title) + '</a>';
      }).join('') + '</div>' : '') +
      '</article>';
  }

  /* ---------- fogalomtérkép (erő-alapú elrendezés, egyszer kiszámolva) ---------- */
  function layout(c, W, H) {
    if (c._layout) return c._layout;
    var L = links(c), n = c.terms.length, pos = {}, k = Math.sqrt(W * H / n) * 0.62;
    c.terms.forEach(function (t, i) {
      var a = i / n * 2 * Math.PI;
      pos[t.id] = { x: W / 2 + Math.cos(a) * W * 0.35, y: H / 2 + Math.sin(a) * H * 0.35 };
    });
    for (var it = 0; it < 400; it++) {
      var temp = 30 * (1 - it / 400) + 1, disp = {};
      c.terms.forEach(function (a) { disp[a.id] = { x: 0, y: 0 }; });
      for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
        var A = c.terms[i].id, B = c.terms[j].id, dx = pos[A].x - pos[B].x, dy = pos[A].y - pos[B].y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy)), f = k * k / d;
        disp[A].x += dx / d * f; disp[A].y += dy / d * f; disp[B].x -= dx / d * f; disp[B].y -= dy / d * f;
      }
      c.terms.forEach(function (t) {
        L[t.id].forEach(function (r) {
          if (t.id > r) return;
          var dx = pos[t.id].x - pos[r].x, dy = pos[t.id].y - pos[r].y, d = Math.max(1, Math.sqrt(dx * dx + dy * dy)), f = d * d / k;
          disp[t.id].x -= dx / d * f; disp[t.id].y -= dy / d * f; disp[r].x += dx / d * f; disp[r].y += dy / d * f;
        });
      });
      c.terms.forEach(function (t) {
        var p = pos[t.id], d = disp[t.id];
        d.x += (W / 2 - p.x) * 0.03; d.y += (H / 2 - p.y) * 0.05;
        var len = Math.max(1, Math.sqrt(d.x * d.x + d.y * d.y));
        p.x += d.x / len * Math.min(len, temp);
        p.y += d.y / len * Math.min(len, temp);
      });
    }
    // A kész elrendezést átméretezzük a rajzterületre.
    var xs = [], ys = [];
    Object.keys(pos).forEach(function (id) { xs.push(pos[id].x); ys.push(pos[id].y); });
    var x0 = Math.min.apply(0, xs), x1 = Math.max.apply(0, xs), y0 = Math.min.apply(0, ys), y1 = Math.max.apply(0, ys);
    Object.keys(pos).forEach(function (id) {
      pos[id].x = 90 + (pos[id].x - x0) / Math.max(1, x1 - x0) * (W - 180);
      pos[id].y = 30 + (pos[id].y - y0) / Math.max(1, y1 - y0) * (H - 75);
    });
    // Feliratok ütközésének feloldása: az átfedő címkéjű pontokat kicsit széttoljuk.
    var ids = Object.keys(pos), lw = {};
    c.terms.forEach(function (t) { lw[t.id] = t.term.replace(/\s*\(.*\)\s*/, '').length * 7.6 + 12; });
    for (var rep = 0; rep < 300; rep++) {
      var moved = false;
      for (var a = 0; a < ids.length; a++) for (var b = a + 1; b < ids.length; b++) {
        var P = pos[ids[a]], Q = pos[ids[b]], dx = Q.x - P.x, dy = Q.y - P.y;
        var ox = (lw[ids[a]] + lw[ids[b]]) / 2 - Math.abs(dx), oy = 34 - Math.abs(dy);
        if (ox > 0 && oy > 0) {
          moved = true;
          if (oy < ox) { var sy = (dy >= 0 ? 1 : -1) * Math.min(oy, 6) / 2; P.y -= sy; Q.y += sy; }
          else { var sx = (dx >= 0 ? 1 : -1) * Math.min(ox, 6) / 2; P.x -= sx; Q.x += sx; }
        }
      }
      ids.forEach(function (id) { pos[id].x = Math.min(W - lw[id] / 2, Math.max(lw[id] / 2, pos[id].x)); pos[id].y = Math.min(H - 30, Math.max(14, pos[id].y)); });
      if (!moved) break;
    }
    c._layout = pos;
    return pos;
  }
  function mapHtml(c) {
    var W = 900, H = 640, pos = layout(c, W, H), L = links(c), edges = '', nodes = '';
    c.terms.forEach(function (t) {
      L[t.id].forEach(function (r) {
        if (t.id < r) edges += '<line data-a="' + t.id + '" data-b="' + r + '" x1="' + pos[t.id].x.toFixed(1) + '" y1="' + pos[t.id].y.toFixed(1) + '" x2="' + pos[r].x.toFixed(1) + '" y2="' + pos[r].y.toFixed(1) + '"/>';
      });
    });
    c.terms.forEach(function (t) {
      var p = pos[t.id], r = 6 + Math.min(8, L[t.id].length * 1.4);
      nodes += '<g class="node" data-id="' + t.id + '" tabindex="0" role="button" aria-label="' + esc(t.term) + '" transform="translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')">' +
        '<circle r="' + r.toFixed(1) + '" fill="' + topicColor(c, t.topic) + '"/><text y="' + (r + 15).toFixed(1) + '">' + esc(t.term.replace(/\s*\(.*\)\s*/, '')) + '</text></g>';
    });
    return '<svg class="cmap" viewBox="0 0 ' + W + ' ' + H + '"><g class="edges">' + edges + '</g>' + nodes + '</svg>';
  }

  /* ---------- tanulókártyák (Leitner-módszer, 5 doboz) ---------- */
  function cardsBox(root, c) {
    var key = 'leitner.' + c.id, boxes = S.store.get(key, {}), queue = [], cur = null, flipped = false, seen = 0, good = 0;
    function build() {
      // A kisebb sorszámú dobozok kártyái gyakrabban jönnek elő.
      var pool = [];
      c.terms.forEach(function (t) { var b = boxes[t.id] || 1; for (var i = 0; i < 6 - b; i++) pool.push(t); });
      queue = S.shuffle(pool).filter(function (t, i, a) { return a.indexOf(t) === i; }).slice(0, 12);
      queue.sort(function (a, b) { return (boxes[a.id] || 1) - (boxes[b.id] || 1) + (Math.random() - 0.5) * 2; });
    }
    function stats() {
      var cnt = [0, 0, 0, 0, 0];
      c.terms.forEach(function (t) { cnt[(boxes[t.id] || 1) - 1]++; });
      return '<div class="leitner">' + cnt.map(function (n, i) {
        return '<div><small>' + (i + 1) + '. doboz</small><b>' + n + '</b><span class="bar"><i style="width:' + Math.round(n / c.terms.length * 100) + '%"></i></span></div>';
      }).join('') + '</div>';
    }
    function show() {
      if (!queue.length) {
        root.innerHTML = '<div class="card pad"><h3>Kör vége</h3><p>' + good + ' / ' + seen + ' fogalmat tudtál.</p>' + stats() +
          '<p class="muted">Az 5. dobozban lévő fogalmakat már jól tudod. A rosszul tudottak visszakerülnek az 1. dobozba, és hamarabb előkerülnek.</p>' +
          '<div class="row"><button type="button" class="btn primary" id="lc-again">Új kör</button><button type="button" class="btn" id="lc-reset">Dobozok ürítése</button></div></div>';
        root.querySelector('#lc-again').addEventListener('click', function () { seen = good = 0; build(); show(); });
        root.querySelector('#lc-reset').addEventListener('click', function () { boxes = {}; S.store.set(key, boxes); seen = good = 0; build(); show(); });
        return;
      }
      cur = queue[0]; flipped = false;
      var reverse = Math.random() < 0.35 && cur.en; // néha angolból kérdez
      root.innerHTML = stats() +
        '<button type="button" class="flash" id="lc-card" aria-live="polite"><span class="muted">' + esc(topicTitle(c, cur.topic)) + ' · ' + (boxes[cur.id] || 1) + '. doboz</span>' +
        '<span class="flash-front">' + (reverse ? '🇬🇧 ' + esc(cur.en) : esc(cur.term)) + '</span>' +
        '<span class="flash-hint muted">Gondold végig, mit jelent, aztán kattints a megfordításhoz!</span></button>' +
        '<div class="row" id="lc-act" style="justify-content:center;margin-top:12px"></div>';
      var card = root.querySelector('#lc-card');
      card.addEventListener('click', function () {
        if (flipped) return; flipped = true;
        card.classList.add('flipped');
        card.innerHTML = '<span class="muted">' + esc(cur.term) + (cur.en ? ' · 🇬🇧 ' + esc(cur.en) : '') + '</span><span class="flash-back">' + S.inline(cur.short) + '</span>';
        var act = root.querySelector('#lc-act');
        act.innerHTML = '<button type="button" class="btn" id="lc-no">✘ Nem tudtam</button><button type="button" class="btn primary" id="lc-yes">✔ Tudtam</button>' +
          '<a class="btn" href="#/egyetem/' + c.id + '/fogalom/' + cur.id + '">Részletek</a>';
        act.querySelector('#lc-yes').addEventListener('click', function () { answer(true); });
        act.querySelector('#lc-no').addEventListener('click', function () { answer(false); });
        act.querySelector('#lc-yes').focus();
      });
    }
    function answer(ok) {
      seen++; if (ok) good++;
      boxes[cur.id] = ok ? Math.min(5, (boxes[cur.id] || 1) + 1) : 1;
      S.store.set(key, boxes);
      queue.shift();
      if (!ok) queue.splice(Math.min(queue.length, 3), 0, cur); // hamarosan újra előjön
      if (seen > 24) queue = [];
      show();
    }
    build(); show();
  }

  /* Automatikus kvíz: definíció → fogalom, fogalom → angol megfelelő. */
  function autoQuiz(c) {
    var terms = c.terms;
    return S.shuffle(terms).slice(0, Math.min(8, terms.length)).map(function (t) {
      var others = S.shuffle(terms.filter(function (x) { return x !== t; })).slice(0, 3);
      if (t.en && Math.random() < 0.3 && others.every(function (o) { return o.en; })) {
        return { q: 'Mi a(z) **' + t.term + '** angol szakkifejezése?', options: [t.en].concat(others.map(function (o) { return o.en; })), answer: 0, explain: t.term + ' = ' + t.en + '. ' + t.short };
      }
      return { q: 'Melyik fogalomra illik ez a meghatározás? „' + t.short + '”', options: [t.term].concat(others.map(function (o) { return o.term; })), answer: 0, explain: '**' + t.term + '**' + (t.en ? ' (' + t.en + ')' : '') + '.' };
    });
  }

  /* ---------- oldalak ---------- */
  S.pageUniList = function (main) {

      '<h1>Egyetemi szakszótár és vizuális jegyzet</h1><p class="lead">Szakszavak érthetően, ábrákkal és angol megfelelővel. Kattintható képletek, fogalomtérkép, ami megmutatja, mi mivel függ össze, és tanulókártyák a vizsgára készüléshez.</p>' +
      '<div class="grid" style="margin-top:18px">' + S.courses.map(function (c) {
        return '<a class="card tile" style="--tile:' + c.color + '" href="#/egyetem/' + c.id + '"><span class="ico">' + c.icon + '</span><h3>' + esc(c.title) + '</h3><p>' + esc(c.description) + '</p>' +
          '<span class="meta">' + esc(c.level || '') + ' · ' + c.terms.length + ' szakszó · ' + (c.formulas || []).length + ' képlet</span></a>';
      }).join('') + '</div>';
  };

  S.pageCourse = function (main, id, tab) {
    var c = S.courseById(id);
    if (!c) return false;
    c.formulas = c.formulas || [];
    tab = tab || 'szotar';
    var TABS = [['szotar', '📖 Szakszótár'], ['terkep', '🕸️ Fogalomtérkép'], ['kepletek', '∑ Képletek'], ['kartyak', '🃏 Tanulókártyák'], ['kviz', '✔ Kvíz']];
    setTimeout(function () { var k = main.querySelector('.tabs.big'); if (k) k.insertAdjacentHTML('beforeend', '<a href="#/teszt?targy=' + c.id + '">📝 Teszt</a>'); }, 0);
    main.innerHTML = '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><a href="#/egyetem">Egyetem</a><span>›</span><span>' + esc(c.title) + '</span></nav>' +
      '<div class="subject-head" style="--tile:' + c.color + '"><span class="ico">' + c.icon + '</span><div><h1>' + esc(c.title) + '</h1><p class="lead" style="margin:0">' + esc(c.description) + '</p></div></div>' +
      (c.intro ? '<div class="lesson-body">' + md(c.intro) + '</div>' : '') +
      '<div class="tabs big" role="tablist">' + TABS.map(function (t) {
        return '<a role="tab" aria-selected="' + (t[0] === tab) + '" class="' + (t[0] === tab ? 'on' : '') + '" href="#/egyetem/' + c.id + '/' + t[0] + '">' + t[1] + '</a>';
      }).join('') + '</div><div id="uni-body"></div>';
    var body = main.querySelector('#uni-body');

    if (tab === 'szotar') {
      var topic = '', q = '';
      body.innerHTML = '<div class="row" style="margin-bottom:12px"><input type="search" class="filter" id="gl-q" placeholder="Szűrés a szakszavak között (magyarul vagy angolul)…" aria-label="Szűrés">' +
        '</div><div class="chips" id="gl-topics" style="margin:0 0 14px"><button type="button" class="chip on" data-t="">Mind</button>' + (c.topics || []).map(function (t) {
          return '<button type="button" class="chip" data-t="' + t.id + '" style="--tc:' + topicColor(c, t.id) + '"><i class="dot"></i>' + esc(t.title) + '</button>';
        }).join('') + '</div><div id="gl-list"></div>';
      var paint = function () {
        var nq = S.norm(q);
        var list = sortTerms(c.terms).filter(function (t) {
          return (!topic || t.topic === topic) && (!nq || S.norm(t.term + ' ' + (t.en || '') + ' ' + t.short).indexOf(nq) >= 0);
        });
        var groups = {}, order = [];
        list.forEach(function (t) { var L = t.term.charAt(0).toUpperCase(); if (!groups[L]) { groups[L] = []; order.push(L); } groups[L].push(t); });
        body.querySelector('#gl-list').innerHTML = list.length ? order.map(function (L) {
          return '<h3 class="letter">' + esc(L) + '</h3><div class="gl-grid">' + groups[L].map(function (t) {
            return '<a class="card gl-item" style="--tc:' + topicColor(c, t.topic) + '" href="#/egyetem/' + c.id + '/fogalom/' + t.id + '"><b>' + esc(t.term) + '</b>' +
              (t.en ? '<small>🇬🇧 ' + esc(t.en) + '</small>' : '') + '<span>' + S.inline(t.short) + '</span></a>';
          }).join('') + '</div>';
        }).join('') : '<div class="empty card">Nincs ilyen szakszó.</div>';
      };
      body.querySelector('#gl-q').addEventListener('input', function (e) { q = e.target.value; paint(); });
      body.querySelectorAll('#gl-topics .chip').forEach(function (b) {
        b.addEventListener('click', function () {
          topic = b.dataset.t;
          body.querySelectorAll('#gl-topics .chip').forEach(function (x) { x.classList.toggle('on', x === b); });
          paint();
        });
      });
      paint();
    } else if (tab === 'terkep') {
      body.innerHTML = '<p class="muted">Minden pont egy fogalom, a vonalak a kapcsolatokat jelölik. Minél nagyobb a pont, annál több mindennel függ össze. Kattints egy pontra!</p>' +
        '<div class="chips" style="margin:0 0 10px">' + (c.topics || []).map(function (t) { return '<span class="chip" style="--tc:' + topicColor(c, t.id) + '"><i class="dot"></i>' + esc(t.title) + '</span>'; }).join('') + '</div>' +
        '<div class="map-layout"><div class="card" style="padding:8px">' + mapHtml(c) + '</div><aside class="card pad" id="map-side"><p class="muted">Válassz egy fogalmat a térképen.</p></aside></div>';
      var svg = body.querySelector('.cmap'), L = links(c);
      var pick = function (id) {
        svg.classList.add('has-sel');
        svg.querySelectorAll('.node').forEach(function (g) { g.classList.toggle('sel', g.dataset.id === id); g.classList.toggle('nb', L[id].indexOf(g.dataset.id) >= 0); });
        svg.querySelectorAll('line').forEach(function (l) { l.classList.toggle('sel', l.dataset.a === id || l.dataset.b === id); });
        var t = termById(c, id);
        body.querySelector('#map-side').innerHTML = termHtml(c, t, true) + '<p><a class="btn primary" href="#/egyetem/' + c.id + '/fogalom/' + id + '">Teljes leírás →</a></p>';
        bindFormulas(body.querySelector('#map-side'), c.formulas);
        S.mountWidgets(body.querySelector('#map-side'));
      };
      svg.querySelectorAll('.node').forEach(function (g) {
        g.addEventListener('click', function () { pick(g.dataset.id); });
        g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(g.dataset.id); } });
      });
    } else if (tab === 'kepletek') {
      body.innerHTML = c.formulas.length ? '<p class="muted">Minden színes jel kattintható: megmutatja, mit jelent és mi a mértékegysége.</p>' + c.formulas.map(formulaHtml).join('') : '<div class="empty card">Ehhez a kurzushoz még nincs képlet.</div>';
      bindFormulas(body, c.formulas);
    } else if (tab === 'kartyak') {
      cardsBox(body, c);
    } else if (tab === 'kviz') {
      body.innerHTML = '<p class="muted">A kérdések minden alkalommal a szakszótárból generálódnak újra.</p><div class="quiz card" id="uq"></div>';
      S.renderQuiz(body.querySelector('#uq'), autoQuiz(c), 'course/' + c.id);
    }
    return true;
  };

  S.pageTerm = function (main, cid, tid) {
    var c = S.courseById(cid), t = c && termById(c, tid);
    if (!t) return false;
    c.formulas = c.formulas || [];
    var sorted = sortTerms(c.terms), i = sorted.indexOf(t), prev = sorted[i - 1], next = sorted[i + 1];
    main.innerHTML = '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><a href="#/egyetem">Egyetem</a><span>›</span><a href="#/egyetem/' + c.id + '">' + esc(c.title) + '</a><span>›</span><span>' + esc(t.term) + '</span></nav>' +
      '<div class="lesson-body term-page">' + termHtml(c, t, false) + '</div>' +
      '<nav class="pager">' + (prev ? '<a class="btn" href="#/egyetem/' + c.id + '/fogalom/' + prev.id + '">← ' + esc(prev.term) + '</a>' : '<span></span>') +
      (next ? '<a class="btn" href="#/egyetem/' + c.id + '/fogalom/' + next.id + '">' + esc(next.term) + ' →</a>' : '<a class="btn" href="#/egyetem/' + c.id + '">Vissza a szótárhoz</a>') + '</nav>';
    bindFormulas(main, c.formulas);
    S.mountWidgets(main);
    return true;
  };
})();

</script>

      { id: 'lhospital', term: "L'Hospital-szabály", en: "L'Hôpital's rule", topic: 'derivalt',

      { id: 'szelsoertek', term: 'Szélsőérték', en: 'extremum (local maximum / minimum)', topic: 'derivalt',

      { id: 'kozepertektetel', term: 'Lagrange-középértéktétel', en: 'mean value theorem', topic: 'derivalt',
        short: 'Ha f folytonos [a; b]-n és differenciálható (a; b)-n, akkor van olyan ξ ∈ (a; b), hogy f′(ξ) = [f(b) − f(a)]/(b − a).',

      { id: 'taylor-polinom', term: 'Taylor-polinom', en: 'Taylor polynomial', topic: 'derivalt',

        text: '`Tₙ(x) = f(a) + f′(a)(x − a) + f″(a)/2!·(x − a)² + … + f⁽ⁿ⁾(a)/n!·(x − a)ⁿ`\n\nAz n = 1 eset az érintő. A hibát a **Lagrange-féle maradéktag** adja: `Rₙ(x) = f⁽ⁿ⁺¹⁾(ξ)/(n+1)! · (x − a)ⁿ⁺¹`, valamilyen a és x közötti ξ-vel.\n\nAz a = 0 körüli polinom a **Maclaurin-polinom**. Fontos példák:\n\n- `eˣ ≈ 1 + x + x²/2! + x³/3! + …`\n- `sin x ≈ x − x³/3! + x⁵/5! − …`\n- `cos x ≈ 1 − x²/2! + x⁴/4! − …`\n- `ln(1 + x) ≈ x − x²/2 + x³/3 − …`\n\nA számológépek és a mérnöki közelítések (kis szögeknél sin x ≈ x) is erre épülnek.',

 * Az első kulcs a tantárgy (vagy egyetemi kurzus) azonosítója, a belső kulcsok a lecke (vagy témakör) azonosítói. */
(function () {
  'use strict';
  var S = window.STUDIE, esc = S.esc;
  S.bank = {};
  S.addQuestions = function (group, byTopic) {
    var g = S.bank[group] = S.bank[group] || {};
    Object.keys(byTopic).forEach(function (t) { g[t] = (g[t] || []).concat(byTopic[t]); });
  };
  var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

  /* ---------- a kérdésbank összeállítása ---------- */
  function genTermQuestions(c, topicId) {
    var terms = c.terms.filter(function (t) { return t.topic === topicId; }), out = [];
    function distract(t, pick) {
      var same = S.shuffle(c.terms.filter(function (x) { return x !== t && x.topic === t.topic && pick(x); }));
      var other = S.shuffle(c.terms.filter(function (x) { return x !== t && x.topic !== t.topic && pick(x); }));
      return same.concat(other).slice(0, 3);
    }
    terms.forEach(function (t) {
      var d = distract(t, function () { return true; });
      if (d.length === 3) {
        out.push({ id: 'g-' + c.id + '-' + t.id + '-def', q: 'Melyik fogalomra illik ez a meghatározás? „' + t.short + '”', options: [t.term].concat(d.map(function (x) { return x.term; })), answer: 0,
          explain: '**' + t.term + '**' + (t.en ? ' (🇬🇧 ' + t.en + ')' : '') + '. [[#/egyetem/' + c.id + '/fogalom/' + t.id + '|A szakszó részletes leírása →]]' });
        out.push({ id: 'g-' + c.id + '-' + t.id + '-rev', q: 'Mit jelent a(z) **' + t.term + '** kifejezés?', options: [t.short].concat(d.map(function (x) { return x.short; })), answer: 0,
          explain: t.short });
      }
      if (t.en) {
        var de = distract(t, function (x) { return !!x.en; });
        if (de.length === 3) out.push({ id: 'g-' + c.id + '-' + t.id + '-en', q: 'Mi a(z) **' + t.term + '** angol szakkifejezése?', options: [t.en].concat(de.map(function (x) { return x.en; })), answer: 0, explain: t.term + ' = ' + t.en + '.' });
      }
    });
    return out;
  }

  /* Csoportok → témák → kérdések. Minden kérdés kap egy stabil azonosítót a statisztikához. */
  function buildGroups() {
    var groups = [];
    S.subjects.forEach(function (s) {
      var extra = S.bank[s.id] || {};
      groups.push({ id: s.id, title: s.title, icon: s.icon, color: s.color, kind: 'Tantárgy',
        topics: s.lessons.map(function (l) {
          var qs = (l.quiz || []).concat(extra[l.id] || []).map(function (q, i) { return Object.assign({ id: s.id + '/' + l.id + '/' + i }, q); });
          return { id: l.id, title: l.title, href: '#/lecke/' + s.id + '/' + l.id, questions: qs };
        }).filter(function (t) { return t.questions.length; }) });
    });
    var models = Object.keys(S.models).map(function (k) { return S.models[k]; }).filter(function (m) { return m.quiz && m.quiz.length; });
    if (models.length) groups.push({ id: 'felfedezo', title: 'Mi miből áll?', icon: '🔍', color: '#0e9aa7', kind: 'Felfedező',
      topics: models.map(function (m) {
        return { id: m.id, title: m.title, href: '#/felfedezo/' + m.id, questions: m.quiz.concat((S.bank.felfedezo || {})[m.id] || []).map(function (q, i) { return Object.assign({ id: 'model/' + m.id + '/' + i }, q); }) };
      }) });
    (S.courses || []).forEach(function (c) {
      var extra = S.bank[c.id] || {};
      groups.push({ id: c.id, title: c.title, icon: c.icon, color: c.color, kind: 'Egyetem',
        topics: (c.topics || []).map(function (t) {
          return { id: t.id, title: t.title, href: '#/egyetem/' + c.id, questions: genTermQuestions(c, t.id).concat((extra[t.id] || []).map(function (q, i) { return Object.assign({ id: c.id + '/' + t.id + '/x' + i }, q); })) };
        }).filter(function (t) { return t.questions.length; }) });
    });
    return groups.filter(function (g) { return g.topics.length; });
  }

  /* ---------- statisztika ---------- */
  function stats() { return S.store.get('teszt.stats', {}); }
  function topicPct(st, key) { var x = st[key]; return x && x.n ? Math.round(x.ok / x.n * 100) : null; }
  function grade(pct) {
    return pct >= 88 ? [5, 'jeles'] : pct >= 75 ? [4, 'jó'] : pct >= 62 ? [3, 'közepes'] : pct >= 50 ? [2, 'elégséges'] : [1, 'elégtelen'];
  }

  /* ---------- beállító oldal ---------- */
  S.pageTeszt = function (main, params) {
    var groups = buildGroups(), st = stats();
    var saved = S.store.get('teszt.setup', { mode: 'azonnali', count: 20, sel: null });
    var sel = {};
    if (params.targy) groups.forEach(function (g) { if (g.id === params.targy) g.topics.forEach(function (t) { sel[g.id + '/' + t.id] = 1; }); });
    else if (saved.sel) saved.sel.forEach(function (k) { sel[k] = 1; });
    else groups.slice(0, 1).forEach(function (g) { g.topics.forEach(function (t) { sel[g.id + '/' + t.id] = 1; }); });
    var mode = saved.mode, count = saved.count;
    var total = 0; groups.forEach(function (g) { g.topics.forEach(function (t) { total += t.questions.length; }); });

    // gyenge témák: legalább 4 megválaszolt kérdés, 70% alatt
    var weak = [];
    groups.forEach(function (g) { g.topics.forEach(function (t) { var p = topicPct(st, g.id + '/' + t.id); if (p != null && st[g.id + '/' + t.id].n >= 4 && p < 70) weak.push({ g: g, t: t, p: p }); }); });
    weak.sort(function (a, b) { return a.p - b.p; });

    main.innerHTML = '<nav class="crumbs"><a href="#/">Kezdőlap</a><span>›</span><span>Tesztközpont</span></nav>' +
      '<h1>Tesztközpont</h1><p class="lead">Válassz témákat, állítsd be a kérdések számát és a módot. A kérdésbankban jelenleg <b>' + total + '</b> kérdés van, mindegyik 4 válaszlehetőséggel.</p>' +
      (weak.length ? '<div class="note warn"><b class="t">Gyenge pontjaid: ezeket érdemes gyakorolni</b><div class="chips" style="margin-top:6px">' + weak.slice(0, 6).map(function (w) {
        return '<button type="button" class="chip" data-weak="' + w.g.id + '/' + w.t.id + '">' + w.g.icon + ' ' + esc(w.t.title) + ' · ' + w.p + '%</button>';
      }).join('') + '</div></div>' : '') +
      '<div class="ts-layout"><div class="ts-topics">' + groups.map(function (g) {
        var n = 0; g.topics.forEach(function (t) { n += t.questions.length; });
        return '<details class="card ts-group" style="--tile:' + g.color + '"' + (g.topics.some(function (t) { return sel[g.id + '/' + t.id]; }) ? ' open' : '') + '>' +
          '<summary><span class="ico">' + g.icon + '</span><span class="ts-gt"><b>' + esc(g.title) + '</b><small>' + g.kind + ' · ' + n + ' kérdés</small></span>' +
          '<label class="ts-all" onclick="event.stopPropagation()"><input type="checkbox" data-group="' + g.id + '"> mind</label></summary>' +
          '<div class="ts-list">' + g.topics.map(function (t) {
            var key = g.id + '/' + t.id, p = topicPct(st, key);
            return '<label class="ts-topic"><input type="checkbox" data-key="' + key + '"' + (sel[key] ? ' checked' : '') + '><span>' + esc(t.title) + '</span>' +
              (p != null ? '<span class="badge ' + (p >= 80 ? 'l1' : p >= 60 ? 'l2' : 'l3') + '">' + p + '%</span>' : '') + '<small>' + t.questions.length + '</small></label>';
          }).join('') + '</div></details>';
      }).join('') + '</div>' +
      '<aside class="card pad ts-side"><h3>Beállítások</h3>' +
      '<p class="muted" style="margin:0 0 4px">Visszajelzés</p><div class="ts-modes">' +
      '<button type="button" data-mode="azonnali"><b>⚡ Azonnali</b><span>Minden kérdés után kiírja, hogy helyes volt-e, magyarázattal.</span></button>' +
      '<button type="button" data-mode="vizsga"><b>📝 Vizsga mód</b><span>Csak a végén értékel. Közben visszaléphetsz és módosíthatsz.</span></button></div>' +
      '<p class="muted" style="margin:14px 0 4px">Kérdések száma</p><div class="seg" id="ts-count">' + [10, 20, 30, 50, 0].map(function (c) {
        return '<button type="button" data-c="' + c + '">' + (c || 'Mind') + '</button>';
      }).join('') + '</div>' +
      '<p class="ts-sum" id="ts-sum"></p><button type="button" class="btn primary" id="ts-start" style="width:100%;justify-content:center">Teszt indítása →</button>' +
      (S.store.get('teszt.history', []).length ? '<h3 style="margin-top:20px">Legutóbbi tesztjeid</h3><ul class="ts-hist">' + S.store.get('teszt.history', []).slice(0, 5).map(function (h) {
        var gr = grade(h.pct);
        return '<li><b>' + h.pct + '%</b> <span class="badge">' + gr[0] + ' (' + gr[1] + ')</span> <small class="muted">' + h.n + ' kérdés · ' + (h.mode === 'vizsga' ? 'vizsga' : 'azonnali') + ' · ' + esc(h.date) + '</small></li>';
      }).join('') + '</ul>' : '') + '</aside></div>';

    function selected() {
      var qs = [];
      groups.forEach(function (g) { g.topics.forEach(function (t) { if (sel[g.id + '/' + t.id]) t.questions.forEach(function (q) { qs.push({ q: q, g: g, t: t }); }); }); });
      return qs;
    }
    function paint() {
      main.querySelectorAll('[data-mode]').forEach(function (b) { b.classList.toggle('on', b.dataset.mode === mode); });
      main.querySelectorAll('#ts-count button').forEach(function (b) { b.classList.toggle('on', +b.dataset.c === count); });
      main.querySelectorAll('[data-key]').forEach(function (i) { i.checked = !!sel[i.dataset.key]; });
      main.querySelectorAll('[data-group]').forEach(function (i) {
        var g = groups.filter(function (x) { return x.id === i.dataset.group; })[0];
        var k = g.topics.filter(function (t) { return sel[g.id + '/' + t.id]; }).length;

      });

      main.querySelector('#ts-sum').innerHTML = avail ? '<b>' + n + '</b> kérdés a kiválasztott <b>' + avail + '</b> közül, ' + (mode === 'vizsga' ? 'vizsga módban.' : 'azonnali visszajelzéssel.') : 'Jelölj ki legalább egy témát!';

      i.addEventListener('change', function () {
        var g = groups.filter(function (x) { return x.id === i.dataset.group; })[0];

  /* ---------- a teszt futtatása ---------- */
  function run(main, items, mode) {
    var qs = items.map(function (it) {
      var opts = S.shuffle(it.q.options.map(function (t, k) { return { t: t, ok: k === it.q.answer }; }));
      return { q: it.q, g: it.g, t: it.t, opts: opts, pick: null, locked: false };
    });
    var i = 0, t0 = Date.now(), finished = false;
    window.scrollTo(0, 0);

    function palette() {
      return '<div class="ts-pal" aria-label="Kérdések">' + qs.map(function (x, k) {
        var cls = k === i ? 'cur' : '';
        if (mode === 'azonnali' && x.locked) cls += x.opts[x.pick].ok ? ' ok' : ' bad';
        else if (x.pick != null) cls += ' done';
        return '<button type="button" data-go="' + k + '" class="' + cls + '">' + (k + 1) + '</button>';
      }).join('') + '</div>';
    }
    function score() { return qs.filter(function (x) { return x.pick != null && x.opts[x.pick].ok; }).length; }

    function show() {
      var x = qs[i], answered = qs.filter(function (y) { return y.pick != null; }).length;
      var reveal = mode === 'azonnali' && x.locked;
      main.innerHTML = '<nav class="crumbs"><a href="#/teszt">Tesztközpont</a><span>›</span><span>' + (mode === 'vizsga' ? '📝 Vizsga mód' : '⚡ Azonnali visszajelzés') + '</span></nav>' +
        '<div class="ts-run"><div class="ts-top"><span class="badge" style="background:color-mix(in srgb,' + x.g.color + ' 18%,transparent)">' + x.g.icon + ' ' + esc(x.g.title) + ' › ' + esc(x.t.title) + '</span>' +
        '<span class="muted">' + (mode === 'azonnali' ? 'Pontszám: <b>' + score() + '</b> / ' + qs.filter(function (y) { return y.locked; }).length : 'Megválaszolva: <b>' + answered + '</b> / ' + qs.length) + '</span></div>' +
        '<div class="bar" style="margin:10px 0 16px"><i style="width:' + Math.round((i + 1) / qs.length * 100) + '%"></i></div>' +
        '<div class="card quiz ts-q"><div class="progress">' + (i + 1) + '. kérdés / ' + qs.length + '</div><div class="q">' + S.inline(x.q.q) + '</div><div class="opts">' +
        x.opts.map(function (o, k) {
          var cls = 'opt';
          if (reveal) { if (o.ok) cls += ' right'; else if (k === x.pick) cls += ' wrong'; }
          else if (k === x.pick) cls += ' picked';
          return '<button type="button" class="' + cls + '" data-k="' + k + '"' + (reveal ? ' disabled' : '') + '><span class="ltr">' + LETTERS[k] + '</span>' + S.inline(o.t) + '</button>';
        }).join('') + '</div>' +
        (reveal ? '<div class="explain"><b>' + (x.opts[x.pick].ok ? '✔ Helyes!' : '✘ Nem jó. A helyes válasz: ' + LETTERS[x.opts.findIndex(function (o) { return o.ok; })]) + '</b> ' + S.inline(x.q.explain || '') + '</div>' : '') +
        '<div class="row ts-nav"><button type="button" class="btn" id="ts-prev"' + (i ? '' : ' disabled') + '>← Előző</button>' +
        (i < qs.length - 1 ? '<button type="button" class="btn primary" id="ts-next"' + (mode === 'azonnali' && !x.locked ? ' disabled' : '') + '>Következő →</button>' : '') +
        (mode === 'vizsga' || i === qs.length - 1 ? '<button type="button" class="btn ' + (i === qs.length - 1 ? 'primary' : '') + '" id="ts-submit"' + (mode === 'azonnali' && !x.locked ? ' disabled' : '') + '>' + (mode === 'vizsga' ? 'Beadás és értékelés' : 'Eredmény') + '</button>' : '') +
        '</div><p class="muted ts-keys">Billentyűk: 1–4 vagy A–D a válaszhoz, Enter a továbblépéshez.</p></div>' + palette() + '</div>';

      main.querySelectorAll('.opt').forEach(function (b) {
        b.addEventListener('click', function () { choose(+b.dataset.k); });
      });
      var nx = main.querySelector('#ts-next'), pv = main.querySelector('#ts-prev'), sb = main.querySelector('#ts-submit');
      if (nx) nx.addEventListener('click', function () { i++; show(); });
      pv.addEventListener('click', function () { i--; show(); });
      if (sb) sb.addEventListener('click', submit);
      main.querySelectorAll('[data-go]').forEach(function (b) { b.addEventListener('click', function () { i = +b.dataset.go; show(); }); });
      if (reveal && nx) nx.focus();
    }
    function choose(k) {
      var x = qs[i];
      if (x.locked) return;

      show();
    }
    function submit() {
      var open = qs.filter(function (x) { return x.pick == null; }).length;
      if (open && !confirm(open + ' kérdésre még nem válaszoltál. Biztosan beadod?')) return;
      finished = true;

    }
    function onKey(e) {
      if (finished || !document.body.contains(main.querySelector('.ts-run'))) { document.removeEventListener('keydown', onKey); return; }
      if (e.target.closest && e.target.closest('input, textarea')) return;
      var k = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 }[e.key.toLowerCase()];
      if (k != null && k < qs[i].opts.length) { choose(k); e.preventDefault(); }
      else if (e.key === 'Enter' || e.key === 'ArrowRight') {
        if (i < qs.length - 1 && (mode === 'vizsga' || qs[i].locked)) { i++; show(); e.preventDefault(); }
      } else if (e.key === 'ArrowLeft' && i > 0) { i--; show(); }
    }
    document.addEventListener('keydown', onKey);

    function results() {
      var ok = score(), pct = Math.round(ok / qs.length * 100), gr = grade(pct), secs = Math.round((Date.now() - t0) / 1000);
      // statisztika mentése témánként
      var st = stats(), byTopic = {};
      qs.forEach(function (x) {
        var key = x.g.id + '/' + x.t.id, good = x.pick != null && x.opts[x.pick].ok;
        st[key] = st[key] || { n: 0, ok: 0 }; st[key].n++; if (good) st[key].ok++;
        byTopic[key] = byTopic[key] || { g: x.g, t: x.t, n: 0, ok: 0 }; byTopic[key].n++; if (good) byTopic[key].ok++;
      });
      S.store.set('teszt.stats', st);
      var hist = S.store.get('teszt.history', []);
      hist.unshift({ pct: pct, n: qs.length, mode: mode, date: new Date().toLocaleDateString('hu-HU') + ' ' + new Date().toLocaleTimeString('hu-HU', { hour: '2-digit', minute: '2-digit' }) });
      S.store.set('teszt.history', hist.slice(0, 30));
      var wrong = qs.filter(function (x) { return x.pick == null || !x.opts[x.pick].ok; });
      var filter = 'mind';

      function paintReview() {
        var list = filter === 'hibas' ? wrong : qs;

          var n = qs.indexOf(x) + 1, good = x.pick != null && x.opts[x.pick].ok;
          return '<div class="card ts-rv ' + (good ? 'ok' : 'bad') + '"><div class="row" style="justify-content:space-between"><b>' + n + '. ' + (good ? '✔' : x.pick == null ? '– nincs válasz' : '✘') + '</b><small class="muted">' + x.g.icon + ' ' + esc(x.t.title) + '</small></div>' +
            '<div class="q">' + S.inline(x.q.q) + '</div><ul>' + x.opts.map(function (o, k) {
              return '<li class="' + (o.ok ? 'right' : k === x.pick ? 'wrong' : '') + '"><span class="ltr">' + LETTERS[k] + '</span>' + S.inline(o.t) + (o.ok ? ' <b>✔ helyes</b>' : k === x.pick ? ' <b>← a te válaszod</b>' : '') + '</li>';
            }).join('') + '</ul>' + (x.q.explain ? '<div class="explain">' + S.inline(x.q.explain) + '</div>' : '') + '</div>';
        }).join('') : '<div class="empty card">Nincs hibás válasz. 🎉</div>';
        main.querySelectorAll('[data-f]').forEach(function (b) { b.classList.toggle('on', b.dataset.f === filter); });
      }

      main.innerHTML = '<nav class="crumbs"><a href="#/teszt">Tesztközpont</a><span>›</span><span>Eredmény</span></nav>' +
        '<div class="ts-result card pad"><div class="ts-score g' + gr[0] + '"><b>' + pct + '%</b><span>' + gr[0] + ' – ' + gr[1] + '</span></div>' +
        '<div><h1 style="margin-bottom:4px">' + (pct === 100 ? 'Hibátlan! 🏆' : pct >= 75 ? 'Szép munka!' : pct >= 50 ? 'Átmentél, de van még mit gyakorolni.' : 'Ezt még gyakorolni kell.') + '</h1>' +
        '<p class="muted">' + ok + ' helyes válasz ' + qs.length + ' kérdésből · ' + Math.floor(secs / 60) + ' perc ' + (secs % 60) + ' mp · ' + (mode === 'vizsga' ? 'vizsga mód' : 'azonnali visszajelzés') + '</p>' +
        '<div class="row">' + (wrong.length ? '<button type="button" class="btn primary" id="ts-redo">↻ A hibásak újra (' + wrong.length + ')</button>' : '') +
        '<button type="button" class="btn" id="ts-again">Ugyanezek a témák, új kérdésekkel</button><a class="btn" href="#/teszt">Új beállítás</a></div></div></div>' +
        '<h2>Témánként</h2><div class="ts-topicres">' + Object.keys(byTopic).map(function (k) {
          var b = byTopic[k], p = Math.round(b.ok / b.n * 100);
          return '<a class="card" href="' + b.t.href + '"><span>' + b.g.icon + ' ' + esc(b.t.title) + '</span><span class="bar" style="--tile:' + (p >= 75 ? 'var(--ok)' : p >= 50 ? 'var(--warn)' : 'var(--bad)') + '"><i style="width:' + p + '%"></i></span><b>' + b.ok + '/' + b.n + '</b></a>';
        }).join('') + '</div>' +
        '<div class="row" style="justify-content:space-between;margin-top:28px"><h2 style="margin:0">Válaszaid</h2><div class="seg"><button type="button" data-f="mind">Mind</button><button type="button" data-f="hibas">Csak a hibásak</button></div></div>' +
