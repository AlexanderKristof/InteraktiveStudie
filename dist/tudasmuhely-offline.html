    { q: 'Melyik tört egyenlő a 3/4-del?', options: ['6/12', '9/16', '15/20', '4/3'], answer: 2, explain: 'A 3/4-et 5-tel bővítve 15/20 lesz. A 9/16 nem bővítés, mert ott a számlálót 3-mal, a nevezőt 4-gyel szoroztuk.' }
  ],
  szazalek: [
    { q: 'Mennyi a 350 Ft 20%-a?', options: ['35 Ft', '70 Ft', '17,5 Ft', '700 Ft'], answer: 1, explain: '10% = 35 Ft, tehát 20% = 2 · 35 = 70 Ft. (Vagy: 350 · 0,2 = 70.)' },
    { q: 'Hány százalék 27 a 90-ből?', options: ['27%', '33%', '63%', '30%'], answer: 3, explain: '27 / 90 = 0,3, ami 30%.' },
    { q: 'Minek a 15%-a 45?', options: ['6,75-nek', '675-nek', '30-nak', '300-nak'], answer: 3, explain: '1% = 45 / 15 = 3, így 100% = 300. A 6,75 a tipikus hiba: az a 45 15%-a lenne.' },
    { q: 'Egy termék nettó ára 8000 Ft. Mennyi a bruttó ára 27% ÁFA-val?', options: ['2160 Ft', '10 160 Ft', '8270 Ft', '10 800 Ft'], answer: 1, explain: 'Bruttó = nettó · 1,27 = 8000 · 1,27 = 10 160 Ft. A 2160 Ft csak maga az ÁFA összege.' },
    { q: 'Egy termék bruttó ára 25 400 Ft (27% ÁFA-val). Mennyi a nettó ára?', options: ['18 542 Ft', '24 127 Ft', '20 000 Ft', '32 258 Ft'], answer: 2, explain: 'Nettó = bruttó / 1,27 = 25 400 / 1,27 = 20 000 Ft. A 18 542 Ft a gyakori hiba: a bruttóból levont 27% nem ugyanaz, mert az ÁFA a nettóra vonatkozik.' },
    { q: 'Egy cikk ára 4000 Ft-ról 5000 Ft-ra nő. Hány százalékos az emelés?', options: ['25%', '20%', '125%', '1000%'], answer: 0, explain: 'A növekedés 1000 Ft, az alap az eredeti ár: 1000 / 4000 = 0,25 = 25%.' },
    { q: 'Egy cikk ára 5000 Ft-ról 4000 Ft-ra csökken. Hány százalékos a csökkenés?', options: ['25%', '20%', '80%', '1000%'], answer: 1, explain: 'A csökkenés 1000 Ft, az alap most az 5000 Ft: 1000 / 5000 = 0,2 = 20%. Az új ár az eredeti 80%-a.' },
    { q: '100 000 Ft-ot leköttetsz 2 évre évi 5%-os kamatos kamatra. Mennyi lesz a 2. év végén?', options: ['110 000 Ft', '105 000 Ft', '102 500 Ft', '110 250 Ft'], answer: 3, explain: '100 000 · 1,05 · 1,05 = 100 000 · 1,1025 = 110 250 Ft. A második évben már a kamattal megnövelt összeg kamatozik.' },
    { q: 'Egy árat először 20%-kal, majd az új árat további 10%-kal csökkentik. Összesen hány százalékos a csökkenés?', options: ['28%', '30%', '72%', '2%'], answer: 0, explain: 'A szorzók összeszorzódnak: 0,8 · 0,9 = 0,72, vagyis az ár az eredeti 72%-a lett, a csökkenés 28%.' },
    { q: 'Mivel kell szorozni egy árat, ha 15%-kal csökken?', options: ['1,15-dal', '0,15-dal', '0,85-dal', '0,985-dal'], answer: 2, explain: 'Az új ár az eredeti 100% − 15% = 85%-a, vagyis 0,85-szorosa.' }
  ],
  egyenletek: [
    { q: 'Mennyi x, ha 7x + 4 = 3x + 20?', options: ['6', '2,4', '4', '−4'], answer: 2, explain: 'Vonj ki 3x-et: 4x + 4 = 20. Vonj ki 4-et: 4x = 16, tehát x = 4. Ellenőrzés: 28 + 4 = 32 = 12 + 20.' },
    { q: 'Mennyi x, ha 3(x − 2) = 2x + 5?', options: ['11', '7', '−1', '3'], answer: 0, explain: 'Zárójelbontás: 3x − 6 = 2x + 5. Vonj ki 2x-et és adj hozzá 6-ot: x = 11. A 7 akkor jön ki, ha a 3-mal csak az x-et szorzod meg.' },
    { q: 'Mennyi x, ha x/3 − 2 = 5?', options: ['9', '1', '7', '21'], answer: 3, explain: 'Adj hozzá 2-t: x/3 = 7, majd szorozz 3-mal: x = 21.' },
    { q: 'Mennyi x, ha 5 − 2x = 11?', options: ['3', '−3', '8', '−8'], answer: 1, explain: 'Vonj ki 5-öt: −2x = 6, majd ossz −2-vel: x = −3. Ellenőrzés: 5 − 2 · (−3) = 5 + 6 = 11.' },
    { q: 'Mennyi x, ha (x + 1)/2 = (x − 1)/3?', options: ['−5', '5', '−1', '1'], answer: 0, explain: 'Szorozz 6-tal: 3(x + 1) = 2(x − 1), azaz 3x + 3 = 2x − 2, így x = −5.' },
    { q: 'Hogyan fejezhető ki R a P = U²/R képletből?', options: ['R = P/U²', 'R = P · U²', 'R = U²/P', 'R = U/P'], answer: 2, explain: 'Szorozz R-rel: P · R = U², majd ossz P-vel: R = U²/P.' },
    { q: 'Hogyan fejezhető ki a gyorsulás az s = a · t²/2 képletből?', options: ['a = s/(2t²)', 'a = 2s/t²', 'a = 2s · t²', 'a = s · t²/2'], answer: 1, explain: 'Szorozz 2-vel: 2s = a · t², majd ossz t²-tel: a = 2s/t².' },
    { q: 'Egy szám háromszorosánál 8-cal kisebb szám 31. Melyik ez a szám?', options: ['39', '11', '7,67', '13'], answer: 3, explain: 'Az egyenlet: 3x − 8 = 31. Adj hozzá 8-at: 3x = 39, ossz 3-mal: x = 13.' },
    { q: 'Anna háromszor annyi idős, mint az öccse, és együtt 24 évesek. Hány éves Anna?', options: ['6', '8', '21', '18'], answer: 3, explain: 'Ha az öcs x éves, Anna 3x: x + 3x = 24, tehát 4x = 24, x = 6. Anna 3 · 6 = 18 éves.' },
    { q: 'Melyik egyenletnek nincs megoldása?', options: ['2x + 1 = x + 5', '2(x + 1) = 2x + 5', '3x = 0', 'x + 2 = 2 + x'], answer: 1, explain: 'A zárójelbontás után 2x + 2 = 2x + 5, azaz 2 = 5, ami sosem igaz. A 3x = 0 megoldása x = 0, az x + 2 = 2 + x pedig minden x-re igaz.' }
  ],
  'linearis-fuggveny': [
    { q: 'Mi a zérushelye az y = −3x + 6 függvénynek?', options: ['x = −2', 'x = 6', 'x = 2', 'x = −3'], answer: 2, explain: '−3x + 6 = 0, tehát −3x = −6, x = 2.' },
    { q: 'Melyik egyenes megy át a (0; 2) ponton, −1 meredekséggel?', options: ['y = −x + 2', 'y = 2x − 1', 'y = x + 2', 'y = −2x + 1'], answer: 0, explain: 'Az y = m · x + b alakban m = −1 és b = 2 (az y-tengelymetszet), tehát y = −x + 2.' },
    { q: 'Mekkora a (−1; 4) és a (3; −4) pontokon átmenő egyenes meredeksége?', options: ['2', '−2', '−0,5', '0'], answer: 1, explain: 'm = (−4 − 4) / (3 − (−1)) = −8 / 4 = −2. Figyelj az előjelekre: 3 − (−1) = 4.' },
    { q: 'Melyik egyenes párhuzamos az y = 2x + 1 egyenessel?', options: ['y = −2x + 1', 'y = x/2 + 1', 'y = x + 2', 'y = 2x − 5'], answer: 3, explain: 'A párhuzamos egyeneseknek ugyanakkora a meredekségük. Az y = 2x − 5 meredeksége is 2, csak lejjebb van tolva.' },
    { q: 'Egy taxi alapdíja 800 Ft, kilométerdíja 350 Ft. Hány km-t utaztál, ha 4300 Ft-ot fizettél?', options: ['10 km', '12,3 km', '14,6 km', '9 km'], answer: 0, explain: 'Az egyenlet: 350x + 800 = 4300. Vonj ki 800-at: 350x = 3500, így x = 10 km.' },
    { q: 'Mi a (0; −1) és a (2; 3) pontokon átmenő egyenes egyenlete?', options: ['y = 2x + 3', 'y = −x + 2', 'y = 2x − 1', 'y = 0,5x − 1'], answer: 2, explain: 'A meredekség m = (3 − (−1)) / (2 − 0) = 4 / 2 = 2, a tengelymetszet b = −1 (az x = 0 pontból). Így y = 2x − 1.' },
    { q: 'Melyik pont van rajta az y = −2x + 3 egyenesen?', options: ['(1; −1)', '(−1; 1)', '(2; −1)', '(0; −3)'], answer: 2, explain: 'Behelyettesítve x = 2-t: y = −4 + 3 = −1, ez egyezik. A többinél: x = 1 → y = 1; x = −1 → y = 5; x = 0 → y = 3.' },
    { q: 'Hol metszi egymást az y = x + 1 és az y = −x + 5 egyenes?', options: ['(2; 3)', '(3; 2)', '(4; 5)', '(−2; −1)'], answer: 0, explain: 'A metszéspontban az y-ok egyenlők: x + 1 = −x + 5, így 2x = 4, x = 2, és y = 2 + 1 = 3.' },
    { q: 'Milyen az y = 4 függvény grafikonja?', options: ['Az y-tengellyel párhuzamos egyenes', 'Az origón átmenő egyenes', 'Parabola', 'Az x-tengellyel párhuzamos egyenes'], answer: 3, explain: 'Itt m = 0, tehát minden x-hez ugyanaz az y = 4 tartozik: vízszintes egyenes, ami a (0; 4) pontban metszi az y-tengelyt.' },
    { q: 'Egy autó tankjában 50 l benzin van, és 100 km-en 6 l-t fogyaszt. Mennyi marad 500 km után?', options: ['47 l', '20 l', '30 l', '44 l'], answer: 1, explain: 'A maradék: y = 50 − 0,06x. Ha x = 500, akkor y = 50 − 30 = 20 l. (500 km-en 5 · 6 = 30 l fogy.)' }
  ],
  pitagorasz: [
    { q: 'Mekkora az átfogó, ha a befogók 5 és 12 egység hosszúak?', options: ['13', '17', '11', '8,5'], answer: 0, explain: 'c² = 5² + 12² = 25 + 144 = 169, tehát c = √169 = 13.' },
    { q: 'Egy derékszögű háromszög átfogója 10 cm, egyik befogója 6 cm. Mekkora a másik befogó?', options: ['4 cm', '√136 cm', '8 cm', '16 cm'], answer: 2, explain: '6² + b² = 10², azaz 36 + b² = 100, b² = 64, b = 8 cm. A √136 akkor jön ki, ha a 10-et befogónak veszed.' },
    { q: 'Mekkora az 5 cm oldalú négyzet átlója?', options: ['10 cm', '≈ 7,07 cm', '≈ 3,54 cm', '25 cm'], answer: 1, explain: 'Az átló egy derékszögű háromszög átfogója: d² = 5² + 5² = 50, így d = √50 = 5√2 ≈ 7,07 cm.' },
    { q: 'Mekkora a (−1; 2) és az (5; 10) pont távolsága?', options: ['14', '√20', '100', '10'], answer: 3, explain: 'Vízszintesen 5 − (−1) = 6, függőlegesen 10 − 2 = 8 a különbség. A távolság √(6² + 8²) = √100 = 10.' },
    { q: 'Melyik pitagoraszi számhármas?', options: ['4, 5, 6', '6, 9, 11', '10, 20, 30', '9, 40, 41'], answer: 3, explain: '9² + 40² = 81 + 1600 = 1681 = 41². A többinél nem teljesül, pl. 4² + 5² = 41 ≠ 36.' },
    { q: 'Mekkora a 6 cm oldalú szabályos háromszög magassága?', options: ['3 cm', '3√3 ≈ 5,2 cm', '√45 ≈ 6,7 cm', '6√2 ≈ 8,5 cm'], answer: 1, explain: 'A magasság két derékszögű háromszögre bontja: m² + 3² = 6², így m² = 27, m = √27 = 3√3 ≈ 5,2 cm.' },
    { q: 'Egy 2,6 m-es létra alja 1 m-re van a faltól. Milyen magasan éri el a falat?', options: ['1,6 m', '2,8 m', '2,4 m', '3,6 m'], answer: 2, explain: '1² + h² = 2,6², azaz 1 + h² = 6,76, h² = 5,76, h = 2,4 m.' },
    { q: 'Mekkora a 2 cm élű kocka testátlója?', options: ['2√3 ≈ 3,46 cm', '2√2 ≈ 2,83 cm', '6 cm', '4 cm'], answer: 0, explain: 'Az alaplap átlója √(2² + 2²) = √8. A testátló: √(8 + 2²) = √12 = 2√3 ≈ 3,46 cm. A 2√2 csak a lapátló.' },
    { q: 'Milyen a háromszög, ha a két rövidebb oldal négyzetösszege nagyobb a leghosszabb oldal négyzeténél?', options: ['Derékszögű', 'Hegyesszögű', 'Tompaszögű', 'Biztosan egyenlő oldalú'], answer: 1, explain: 'Ha a² + b² = c², derékszögű; ha nagyobb, a c-vel szemközti szög kisebb 90°-nál, így minden szög hegyes; ha kisebb, tompaszögű.' },
    { q: 'Egy téglalap átlója 10 cm, egyik oldala 6 cm. Mekkora a területe?', options: ['60 cm²', '80 cm²', '24 cm²', '48 cm²'], answer: 3, explain: 'A másik oldal: √(10² − 6²) = √64 = 8 cm. A terület 6 · 8 = 48 cm².' }
  ],
  masodfoku: [
    { q: 'Melyek az x² − x − 12 = 0 egyenlet megoldásai?', options: ['4 és −3', '−4 és 3', '6 és −2', '3 és 4'], answer: 0, explain: 'D = (−1)² − 4 · 1 · (−12) = 1 + 48 = 49. x = (1 ± 7) / 2, tehát 4 és −3. Ellenőrzés: 4 + (−3) = 1, 4 · (−3) = −12.' },
    { q: 'Mik a 2x² − 18 = 0 egyenlet megoldásai?', options: ['x = 9 vagy x = −9', 'csak x = 3', 'x = 3 vagy x = −3', 'nincs valós megoldás'], answer: 2, explain: 'Adj hozzá 18-at és ossz 2-vel: x² = 9. Ennek két megoldása van: 3 és −3, mert (−3)² is 9.' },
    { q: 'Mik az x² − 6x = 0 egyenlet megoldásai?', options: ['csak a 6', '0 és −6', '0 és 6', '−6 és 6'], answer: 2, explain: 'Emeld ki az x-et: x(x − 6) = 0. A szorzat nulla, ha x = 0 vagy x − 6 = 0, azaz x = 6. Az x-szel való osztás elveszítené a 0 megoldást.' },
    { q: 'Hol van az y = x² − 4x + 1 parabola csúcspontja?', options: ['(2; −3)', '(−2; 13)', '(2; 1)', '(4; 1)'], answer: 0, explain: 'x = −b/(2a) = 4/2 = 2, és y = 2² − 4 · 2 + 1 = 4 − 8 + 1 = −3.' },
    { q: 'Mennyi a diszkrimináns a 2x² + 3x − 2 = 0 egyenletben?', options: ['−7', '1', '17', '25'], answer: 3, explain: 'D = b² − 4ac = 3² − 4 · 2 · (−2) = 9 + 16 = 25. A −7 az előjelhiba eredménye.' },
    { q: 'Mennyi az x² − 8x + 15 = 0 egyenlet gyökeinek összege?', options: ['−8', '8', '15', '−15'], answer: 1, explain: 'Viète-formula: x₁ + x₂ = −b/a = −(−8)/1 = 8. (A gyökök 3 és 5.)' },
    { q: 'Melyik egyenlet megoldásai az 1 és a 4?', options: ['x² − 5x + 4 = 0', 'x² + 5x + 4 = 0', 'x² − 4x + 5 = 0', 'x² − 5x − 4 = 0'], answer: 0, explain: 'Gyöktényezős alakban: (x − 1)(x − 4) = x² − 5x + 4. Viète szerint is: összeg 5, szorzat 4.' },
    { q: 'Mekkora k esetén van az x² + 6x + k = 0 egyenletnek pontosan egy megoldása?', options: ['k = 36', 'k = 6', 'k = 9', 'k = −9'], answer: 2, explain: 'Egy megoldás akkor van, ha D = 0: 6² − 4 · 1 · k = 36 − 4k = 0, tehát k = 9. Ekkor x² + 6x + 9 = (x + 3)².' },
    { q: 'Hol van az y = (x − 3)² + 2 parabola csúcspontja?', options: ['(−3; 2)', '(3; 2)', '(3; −2)', '(2; 3)'], answer: 1, explain: 'Az (x − u)² + v alakból a csúcs (u; v). Itt u = 3 (figyelj: x − 3, nem x + 3) és v = 2.' },
    { q: 'Hány valós gyöke van a 3x² + 2x + 1 = 0 egyenletnek?', options: ['Két gyöke van', 'Egy gyöke van', 'Végtelen sok gyöke van', 'Nincs valós gyöke'], answer: 3, explain: 'D = 2² − 4 · 3 · 1 = 4 − 12 = −8 < 0, ezért nincs valós megoldás: a parabola nem metszi az x-tengelyt.' }
  ]
});

  <script>/* data/kerdesek/fizika.js */
/* Fizika – extra gyakorlókérdések a Tesztközponthoz

STUDIE.addQuestions('fizika', {
  'mertekegysegek-mozgas': [
    { q: 'Hány km/h a 15 m/s?', options: ['54 km/h', '4,17 km/h', '15 km/h', '150 km/h'], answer: 0, explain: 'm/s-ból km/h-ba 3,6-tal szorzunk: 15 · 3,6 = 54 km/h. A 4,17 akkor jön ki, ha szorzás helyett osztasz.' },
    { q: 'Egy autó 1,5 óra alatt 120 km-t tesz meg. Mekkora az átlagsebessége?', options: ['180 km/h', '60 km/h', '90 km/h', '80 km/h'], answer: 3, explain: 'v = s / t = 120 km / 1,5 h = 80 km/h.' },
    { q: 'Egy autó álló helyzetből 8 s alatt gyorsul fel 20 m/s-ra. Mekkora az átlagos gyorsulása?', options: ['160 m/s²', '2,5 m/s²', '0,4 m/s²', '12 m/s²'], answer: 1, explain: 'a = Δv / Δt = 20 m/s / 8 s = 2,5 m/s².' },
    { q: 'Egy test álló helyzetből 2 m/s² gyorsulással indul. Mekkora utat tesz meg 5 s alatt?', options: ['25 m', '10 m', '50 m', '5 m'], answer: 0, explain: 's = a · t² / 2 = 2 · 5² / 2 = 2 · 25 / 2 = 25 m. Az 50 m a ½ elfelejtése, a 10 m a négyzetre emelés kihagyása.' },
    { q: 'Egy test álló helyzetből 3 m/s² gyorsulással indul. Mekkora a sebessége 6 s múlva?', options: ['2 m/s', '54 m/s', '18 m/s', '9 m/s'], answer: 2, explain: 'v = a · t = 3 · 6 = 18 m/s.' },
    { q: 'Hány mikrométer (μm) 1 mm?', options: ['100 μm', '1000 μm', '10 μm', '1 000 000 μm'], answer: 1, explain: '1 mm = 0,001 m, 1 μm = 0,000 001 m, tehát 1 mm = 1000 μm.' },
    { q: 'Mennyi idő alatt teszel meg 300 km-t 75 km/h átlagsebességgel?', options: ['3 óra', '0,25 óra', '22 500 óra', '4 óra'], answer: 3, explain: 't = s / v = 300 / 75 = 4 óra.' },
    { q: 'Melyik SI-alapegység?', options: ['gramm', 'newton', 'kilométer per óra', 'kilogramm'], answer: 3, explain: 'A tömeg SI-alapegysége a kilogramm (nem a gramm). A newton és a km/h származtatott egységek.' },
    { q: 'Egy futó átlagsebessége 10 m/s. Hány km/h ez?', options: ['2,78 km/h', '36 km/h', '100 km/h', '3,6 km/h'], answer: 1, explain: '10 · 3,6 = 36 km/h.' },
    { q: 'Mit mutat meg az út-idő grafikon meredeksége egyenletes mozgásnál?', options: ['A gyorsulást', 'A megtett utat', 'A sebességet', 'Az eltelt időt'], answer: 2, explain: 'A meredekség = út változása / idő változása, ez épp v = s / t. Minél meredekebb az egyenes, annál gyorsabb a mozgás.' }
  ],
  newton: [
    { q: 'Egy 1200 kg-os autóra 3600 N eredő erő hat. Mekkora a gyorsulása?', options: ['3 m/s²', '0,33 m/s²', '2400 m/s²', '4800 m/s²'], answer: 0, explain: 'a = F / m = 3600 N / 1200 kg = 3 m/s².' },
    { q: 'Mekkora egy 70 kg-os ember súlya a Földön (g ≈ 10 m/s²)?', options: ['70 N', '700 N', '7 N', '70 kg'], answer: 1, explain: 'G = m · g = 70 · 10 = 700 N. A súly erő, mértékegysége newton, nem kilogramm.' },
    { q: 'Egy testre egy egyenes mentén 30 N erő jobbra és 20 N erő balra hat. Mekkora az eredő erő?', options: ['50 N jobbra', '10 N balra', '0 N', '10 N jobbra'], answer: 3, explain: 'Ellentétes irányú erőknél kivonunk: 30 − 20 = 10 N, a nagyobb erő irányába, azaz jobbra.' },
    { q: 'Egy testre két egymásra merőleges erő hat: 30 N és 40 N. Mekkora az eredő?', options: ['50 N', '70 N', '10 N', '1200 N'], answer: 0, explain: 'Merőleges erőknél a Pitagorasz-tétel adja az eredőt: √(30² + 40²) = √2500 = 50 N.' },
    { q: 'Egy könyv nyugszik az asztalon. Mi a könyv súlyának (a könyv által az asztalra kifejtett nyomóerőnek) az ellenereje?', options: ['A Föld vonzóereje a könyvre', 'A könyv tömege', 'Az asztal által a könyvre kifejtett tartóerő', 'A levegő ellenállása'], answer: 2, explain: 'A hatás-ellenhatás párok két test között hatnak: ha a könyv nyomja az asztalt, az asztal ugyanakkora erővel nyomja vissza a könyvet. A Föld vonzóereje is a könyvre hat, de az a könyv és a Föld közötti erőpár tagja.' },
    { q: 'Egy 2 kg-os testet 10 N erővel húzol, a súrlódási erő 4 N. Mekkora a gyorsulása?', options: ['5 m/s²', '7 m/s²', '3 m/s²', '12 m/s²'], answer: 2, explain: 'Az eredő erő 10 − 4 = 6 N, így a = F / m = 6 / 2 = 3 m/s². Az 5 m/s² a súrlódás elfelejtése.' },
    { q: 'Egy kő álló helyzetből szabadon esik. Mekkora a sebessége 3 s múlva (g ≈ 10 m/s², légellenállás nélkül)?', options: ['30 m/s', '90 m/s', '45 m/s', '3,3 m/s'], answer: 0, explain: 'v = g · t = 10 · 3 = 30 m/s.' },
    { q: 'Mekkora utat tesz meg egy szabadon eső test az első 2 s alatt (g ≈ 10 m/s²)?', options: ['40 m', '10 m', '5 m', '20 m'], answer: 3, explain: 'h = g · t² / 2 = 10 · 4 / 2 = 20 m.' },
    { q: 'Egy autó egyenes úton állandó sebességgel halad. Mekkora a rá ható erők eredője?', options: ['Akkora, mint a motor húzóereje', 'Nulla', 'Akkora, mint az autó súlya', 'Folyamatosan nő'], answer: 1, explain: 'Newton I. törvénye szerint egyenes vonalú egyenletes mozgásnál az eredő erő nulla: a motor húzóereje épp kiegyenlíti a súrlódást és a légellenállást.' },
    { q: 'Hogyan írható fel a newton SI-alapegységekkel?', options: ['kg · m/s²', 'kg · m/s', 'kg/m²', 'kg · s²/m'], answer: 0, explain: 'F = m · a, így 1 N = 1 kg · 1 m/s².' }
  ],
  'energia-munka': [
    { q: 'Mekkora a mozgási energiája egy 2 kg-os, 3 m/s sebességű testnek?', options: ['6 J', '3 J', '9 J', '18 J'], answer: 2, explain: 'E = ½ · m · v² = ½ · 2 · 3² = ½ · 2 · 9 = 9 J. A 18 J a ½ elfelejtése, a 3 J a négyzetre emelés kihagyása.' },
    { q: 'Mekkora egy 5 kg-os test helyzeti energiája 4 m magasan (g ≈ 10 m/s²)?', options: ['20 J', '200 J', '50 J', '2000 J'], answer: 1, explain: 'E = m · g · h = 5 · 10 · 4 = 200 J.' },
    { q: 'Egy labdát 5 m magasról elejtesz. Mekkora sebességgel ér földet (g ≈ 10 m/s², légellenállás nélkül)?', options: ['50 m/s', '100 m/s', '5 m/s', '10 m/s'], answer: 3, explain: 'Energiamegmaradás: m · g · h = ½ · m · v², így v = √(2 · g · h) = √(2 · 10 · 5) = √100 = 10 m/s.' },
    { q: 'Egy gép 20 s alatt 600 J munkát végez. Mekkora a teljesítménye?', options: ['12 000 W', '580 W', '0,033 W', '30 W'], answer: 3, explain: 'P = W / t = 600 J / 20 s = 30 W.' },
    { q: 'Mennyi energiát fogyaszt egy 2 kW-os villanymotor fél óra alatt?', options: ['60 kWh', '1 kWh', '4 kWh', '0,5 kWh'], answer: 1, explain: 'E = P · t = 2 kW · 0,5 h = 1 kWh. A 60 kWh akkor jön ki, ha a 30 percet nem váltod át órába.' },
    { q: 'Egy villanymotor 1500 W-ot vesz fel, és ebből 1200 W hasznos mechanikai teljesítmény. Mekkora a hatásfoka?', options: ['125%', '20%', '80%', '30%'], answer: 2, explain: 'η = hasznos / befektetett = 1200 / 1500 = 0,8 = 80%. A hatásfok sosem lehet 100%-nál nagyobb.' },
    { q: 'Egy daru 50 kg-os terhet 20 s alatt egyenletesen 12 m magasra emel. Mekkora a hasznos teljesítménye (g ≈ 10 m/s²)?', options: ['300 W', '6000 W', '30 W', '120 000 W'], answer: 0, explain: 'W = m · g · h = 50 · 10 · 12 = 6000 J, P = W / t = 6000 / 20 = 300 W.' },
    { q: 'Vízszintesen, egyenletes sebességgel viszel egy táskát. Mennyi munkát végez a táskát tartó, függőleges erőd?', options: ['A táska súlyának és az útnak a szorzatát', 'Nullát, mert az erő merőleges az elmozdulásra', 'Negatív munkát', 'A táska mozgási energiájának kétszeresét'], answer: 1, explain: 'Munkát csak az erőnek az elmozdulás irányába eső része végez. A tartóerő függőleges, az elmozdulás vízszintes, ezért W = 0.' },
    { q: 'Egy hullámvasút kocsija nyugalomból indul egy 20 m magas pontról. Mekkora a sebessége a pálya alján (súrlódás nélkül, g ≈ 10 m/s²)?', options: ['200 m/s', '400 m/s', '14 m/s', '20 m/s'], answer: 3, explain: 'v = √(2 · g · h) = √(2 · 10 · 20) = √400 = 20 m/s. A 400 a gyökvonás elfelejtése.' },
    { q: 'Egy 2000 W-os hajszárítót naponta 15 percig használsz. Mennyibe kerül ez 30 nap alatt, ha 1 kWh ára 70 Ft?', options: ['1050 Ft', '1 050 000 Ft', '35 Ft', '63 000 Ft'], answer: 0, explain: 'Napi energia: 2 kW · 0,25 h = 0,5 kWh, 30 nap alatt 15 kWh. Költség: 15 · 70 = 1050 Ft.' }
  ],
  elektromossag: [
    { q: 'Mekkora annak a fogyasztónak az ellenállása, amelyen 230 V feszültség mellett 2 A áram folyik?', options: ['460 Ω', '0,0087 Ω', '115 Ω', '232 Ω'], answer: 2, explain: 'R = U / I = 230 V / 2 A = 115 Ω.' },
    { q: 'Mekkora feszültség esik egy 50 Ω-os ellenálláson, ha 0,2 A áram folyik át rajta?', options: ['250 V', '0,004 V', '10 V', '50,2 V'], answer: 2, explain: 'U = R · I = 50 · 0,2 = 10 V.' },
    { q: 'Mekkora egy 230 V-ról 5 A áramot felvevő készülék teljesítménye?', options: ['1150 W', '46 W', '235 W', '0,022 W'], answer: 0, explain: 'P = U · I = 230 · 5 = 1150 W.' },
    { q: 'Egy 12 V-os telepre sorosan kötünk egy 2 Ω-os, egy 4 Ω-os és egy 6 Ω-os ellenállást. Mekkora áram folyik?', options: ['12 A', '6 A', '144 A', '1 A'], answer: 3, explain: 'Sorosan az eredő 2 + 4 + 6 = 12 Ω, így I = U / R = 12 / 12 = 1 A.' },
    { q: 'Mekkora egy 4 Ω-os és egy 12 Ω-os ellenállás párhuzamos eredője?', options: ['16 Ω', '3 Ω', '8 Ω', '0,33 Ω'], answer: 1, explain: '1/Re = 1/4 + 1/12 = 3/12 + 1/12 = 4/12 = 1/3, tehát Re = 3 Ω. A 0,33 a reciprok visszafordításának elfelejtése.' },
    { q: 'Egy 12 V-os telepre párhuzamosan kötünk egy 6 Ω-os és egy 3 Ω-os ellenállást. Mekkora a telepből felvett teljes áram?', options: ['6 A', '1,33 A', '4 A', '2 A'], answer: 0, explain: 'Párhuzamosan mindkettőn 12 V van: 12/6 = 2 A és 12/3 = 4 A, összesen 6 A. (Vagy: Re = 2 Ω, I = 12 / 2 = 6 A.)' },
    { q: 'Mennyi töltés halad át egy vezetőn, ha 2 A áram folyik 1 percig?', options: ['2 C', '30 C', '120 C', '0,033 C'], answer: 2, explain: 'Q = I · t = 2 A · 60 s = 120 C. Az idő SI-egysége a másodperc, ezért a percet át kell váltani.' },
    { q: 'Melyik anyag szigetelő?', options: ['Réz', 'Gumi', 'Alumínium', 'Grafit'], answer: 1, explain: 'A gumiban az elektronok kötöttek, ezért nem vezeti az áramot. A réz, az alumínium és a grafit is vezető.' },
    { q: 'Hogyan változik egy vezeték ellenállása, ha ugyanabból az anyagból, ugyanolyan vastagon, kétszer olyan hosszúra készítjük?', options: ['Felére csökken', 'Négyszeresére nő', 'Nem változik', 'Kétszeresére nő'], answer: 3, explain: 'Az ellenállás egyenesen arányos a hosszal, mert az áramnak kétszer akkora úton kell „átküzdenie” magát.' },
    { q: 'Két izzó sorosan van kötve egy telepre. Mi történik, ha az egyik kiég?', options: ['Csak a kiégett alszik ki', 'A másik erősebben világít', 'Semmi sem változik', 'Mindkettő kialszik'], answer: 3, explain: 'Soros kapcsolásnál csak egy útja van az áramnak: ha bárhol megszakad, az egész körben megszűnik az áram. Ezért kötik a lakásban párhuzamosan a fogyasztókat.' }
  ],
  atom: [
    { q: 'A nátrium rendszáma 11, a leggyakoribb izotópjának tömegszáma 23. Hány neutron van a magjában?', options: ['11', '12', '23', '34'], answer: 1, explain: 'Neutronok száma = tömegszám − rendszám = 23 − 11 = 12.' },
    { q: 'Hány elektronja van a kloridionnak (Cl⁻), ha a klór rendszáma 17?', options: ['17', '16', '18', '35'], answer: 2, explain: 'A semleges klóratomnak 17 elektronja van; az egyszeresen negatív ion egy elektront felvett, így 18.' },
    { q: 'Hány elektronja van a magnéziumionnak (Mg²⁺), ha a magnézium rendszáma 12?', options: ['10', '12', '14', '2'], answer: 0, explain: 'A 2+ töltés azt jelenti, hogy két elektront leadott: 12 − 2 = 10.' },
    { q: 'Hány elektron van egy semleges vasatomban (Z = 26, A = 56)?', options: ['56', '26', '30', '82'], answer: 1, explain: 'Semleges atomban az elektronok száma a protonok számával, vagyis a rendszámmal egyenlő: 26. A 30 a neutronok száma.' },
    { q: 'Ki fedezte fel az atommagot aranyfólia-kísérletével?', options: ['Isaac Newton', 'Georg Simon Ohm', 'Albert Einstein', 'Ernest Rutherford'], answer: 3, explain: 'Rutherford 1911-ben alfa-részecskéket lőtt vékony aranyfóliára, és ebből következtetett a kicsi, sűrű, pozitív atommagra.' },
    { q: 'Mit tapasztaltak Rutherford kísérletében az alfa-részecskék többségénél?', options: ['Akadálytalanul áthaladtak a fólián', 'Mind visszapattantak', 'Mind elnyelődtek a fóliában', 'Elektronokká alakultak'], answer: 0, explain: 'A legtöbb részecske eltérülés nélkül átment, csak nagyon kevés pattant vissza. Ebből derült ki, hogy az atom nagyrészt üres, és tömege egy kicsi magban összpontosul.' },
    { q: 'Milyen töltésű a neutron?', options: ['Pozitív', 'Negatív', 'Semleges', 'Hol pozitív, hol negatív'], answer: 2, explain: 'A neutron, ahogy a neve is mutatja, elektromosan semleges. A proton pozitív, az elektron negatív.' },
    { q: 'Hány elektron van az oxigénatom (Z = 8) legkülső héján?', options: ['8', '2', '6', '4'], answer: 2, explain: 'A 8 elektronból 2 az első héjon, 6 a második (külső) héjon van. Ezért vesz fel szívesen 2 elektront.' },
    { q: 'Melyik elem nemesgáz?', options: ['Neon', 'Nátrium', 'Klór', 'Szén'], answer: 0, explain: 'A neon külső elektronhéja telített (8 elektron), ezért szinte semmivel nem lép reakcióba.' },
    { q: 'Mire használják a szén-14 izotópot?', options: ['Atomerőművek üzemanyagaként', 'Tranzisztorok gyártására', 'Ivóvíz fertőtlenítésére', 'Régészeti leletek korának meghatározására'], answer: 3, explain: 'A szén-14 radioaktív, ismert ütemben bomlik. Az élőlényekben mért arányából meg lehet becsülni, mióta halott az élőlény (radiokarbonos kormeghatározás).' }
  ],
  'hullamok-feny': [
    { q: 'Mekkora egy 680 Hz-es hang hullámhossza levegőben (c = 340 m/s)?', options: ['2 m', '0,5 m', '1020 m', '231 200 m'], answer: 1, explain: 'λ = c / f = 340 / 680 = 0,5 m. A 2 m akkor jön ki, ha fordítva osztasz.' },
    { q: 'Mekkora egy 100 MHz-es URH-rádióhullám hullámhossza (c = 3 · 10⁸ m/s)?', options: ['3 m', '0,3 m', '30 m', '3 000 000 m'], answer: 0, explain: '100 MHz = 10⁸ Hz, így λ = c / f = 3 · 10⁸ / 10⁸ = 3 m.' },
    { q: 'A villámlás után 6 s-mal hallod a dörgést. Kb. milyen messze csapott le a villám (a hang sebessége 340 m/s)?', options: ['kb. 6 km', 'kb. 18 km', 'kb. 2 km', 'kb. 0,5 km'], answer: 2, explain: 's = v · t = 340 · 6 = 2040 m ≈ 2 km. (Gyors szabály: 6 s / 3 = 2 km.)' },
    { q: 'Egy fal előtt kiáltasz, és 2 s múlva hallod a visszhangot. Milyen messze van a fal (c = 340 m/s)?', options: ['680 m', '340 m', '170 m', '1360 m'], answer: 1, explain: 'A hang 2 s alatt 340 · 2 = 680 m-t tesz meg, de ez oda-vissza út, így a fal 680 / 2 = 340 m-re van.' },
    { q: 'Melyik longitudinális hullám?', options: ['A látható fény', 'A rádióhullám', 'A röntgensugárzás', 'A hang a levegőben'], answer: 3, explain: 'A hangnál a levegő részecskéi a terjedés irányában rezegnek. Az elektromágneses hullámok (fény, rádió, röntgen) transzverzálisak.' },
    { q: 'Egy 30 000 Hz-es hang…', options: ['infrahang, az ember nem hallja', 'hallható, nagyon mély hang', 'látható fény', 'ultrahang, az ember nem hallja'], answer: 3, explain: 'Az ember kb. 20 Hz és 20 000 Hz között hall. Afölött ultrahang, 20 Hz alatt infrahang van.' },
    { q: 'A látható fény színei közül melyiknek a legnagyobb a hullámhossza?', options: ['Ibolya', 'Vörös', 'Kék', 'Zöld'], answer: 1, explain: 'A vörös kb. 750 nm, az ibolya kb. 380 nm. Ezért a vörösön túli az infravörös, az ibolyán túli az ultraibolya.' },
    { q: 'Egy fénysugár 35°-os beesési szögben érkezik egy síktükörre. Mekkora a visszaverődési szög?', options: ['55°', '70°', '35°', '145°'], answer: 2, explain: 'A visszaverődés törvénye szerint a beesési szög egyenlő a visszaverődési szöggel (mindkettőt a beesési merőlegestől mérjük).' },
    { q: 'A Nap fénye kb. 500 s alatt ér a Földre (c ≈ 300 000 km/s). Kb. milyen messze van a Nap?', options: ['kb. 150 millió km', 'kb. 150 000 km', 'kb. 2,5 millió km', 'kb. 1,5 milliárd km'], answer: 0, explain: 's = c · t = 300 000 km/s · 500 s = 150 000 000 km.' },
    { q: 'A hang melyik jellemzője határozza meg a hangerősséget?', options: ['A frekvencia', 'Az amplitúdó', 'A terjedési sebesség', 'A hullámhossz'], answer: 1, explain: 'Minél nagyobb a rezgés kitérése (amplitúdója), annál hangosabb a hang. A frekvencia a hangmagasságot határozza meg.' }
  ]
});

  <script>/* data/kerdesek/tortenelem.js */
/* Történelem – extra gyakorlókérdések a Tesztközponthoz
 * Formátum: lásd js/teszt.js. A leckék azonosítói megegyeznek a data/tantargyak/tortenelem.js leckéivel. */
STUDIE.addQuestions('tortenelem', {
  okor: [
    { q: 'Ki volt az első római császár?', options: ['Julius Caesar', 'Augustus (Octavianus)', 'Romulus', 'Nero'], answer: 1, explain: 'Octavianus Kr. e. 27-ben kapta meg az Augustus címet, ezzel kezdődött a császárkor. Julius Caesar diktátor volt, de császár nem lett.' },
    { q: 'Melyik évszázadba esik Kr. e. 776, az első olimpia éve?', options: ['Kr. e. 7. század', 'Kr. u. 8. század', 'Kr. e. 77. század', 'Kr. e. 8. század'], answer: 3, explain: 'A Kr. e. 8. század a Kr. e. 800 és 701 közötti éveket jelenti, ebbe esik a 776. A 7. század gyakori elszámolás.' },
    { q: 'Melyik év következik közvetlenül Kr. e. 1 után?', options: ['A 0. év', 'Kr. e. 2', 'Kr. u. 2', 'Kr. u. 1'], answer: 3, explain: 'Az időszámításunkban nincs nulladik év: Kr. e. 1 után rögtön Kr. u. 1 jön.' },
    { q: 'Mit nevezünk neolitikus forradalomnak?', options: ['A fémek felfedezését', 'Az áttérést a földművelésre és az állattartásra', 'Az írás feltalálását', 'A római köztársaság megalakulását'], answer: 1, explain: 'Kr. e. 10 000 körül a Közel-Keleten az emberek gabonát kezdtek termeszteni és állatokat tartani, és letelepedtek.' },
    { q: 'Melyik két folyó között terült el Mezopotámia?', options: ['A Nílus és a Jordán', 'A Duna és a Tisza', 'A Tigris és az Eufrátesz', 'Az Indus és a Gangesz'], answer: 2, explain: 'A görög eredetű név jelentése „folyóköz”: a Tigris és az Eufrátesz öntözéses földművelése tartotta el az első városokat.' },
    { q: 'Mi volt a hieroglifa?', options: ['Az ókori egyiptomi írás jele', 'A sumer agyagtáblák neve', 'Egy görög istenség', 'A római légiók jelvénye'], answer: 0, explain: 'Az egyiptomiak képjelekből álló írását nevezzük hieroglifának. A sumerok ékírást használtak.' },
    { q: 'Mi volt a gízai Nagy Piramis (Kheopsz piramisa) rendeltetése?', options: ['Csillagvizsgáló', 'Egy fáraó sírja', 'A fáraó palotája', 'Gabonaraktár'], answer: 1, explain: 'Kr. e. 2560 körül Kheopsz fáraó sírjának épült. A piramisok a fáraók túlvilági életét szolgálták.' },
    { q: 'Kinek a reformjai teremtették meg Kr. e. 508 körül az athéni demokrácia alapjait?', options: ['Periklészé', 'Julius Caesaré', 'Nagy Sándoré', 'Kleiszthenészé'], answer: 3, explain: 'Kleiszthenész reformjai juttatták a hatalmat a polgárok népgyűlésének kezébe. Periklész később, a Kr. e. 5. század közepén vezette Athént.' },
    { q: 'Melyik mai magyar városrész helyén állt Aquincum?', options: ['Óbuda', 'Pécs belvárosa', 'Szombathely', 'Esztergom'], answer: 0, explain: 'Aquincum a mai Óbuda területén feküdt, Alsó-Pannónia központja volt. Pécs helyén Sopianae, Szombathely helyén Savaria állt.' },
    { q: 'Melyik eseménnyel szokás az ókor végét jelölni?', options: ['Caesar meggyilkolásával (Kr. e. 44)', 'A honfoglalással (895)', 'A Nyugatrómai Birodalom bukásával (476)', 'Róma alapításával (Kr. e. 753)'], answer: 2, explain: 'Kr. u. 476-ban az utolsó nyugatrómai császárt megfosztották trónjától. Ezzel az évvel szokás lezárni az ókort.' }
  ],
  honfoglalas: [
    { q: 'Hol élt a magyarság a 9. században, közvetlenül a honfoglalás előtt?', options: ['Pannóniában', 'Mezopotámiában', 'Etelközben', 'Erdélyben'], answer: 2, explain: 'Etelköz a mai Ukrajna déli részén terült el. Innen indultak a magyar törzsek 895 körül a Kárpát-medencébe.' },
    { q: 'Melyik nyelvcsaládba tartozik a magyar nyelv?', options: ['A finnugor (uráli) nyelvcsaládba', 'A szláv nyelvcsaládba', 'A germán nyelvcsaládba', 'Az újlatin nyelvcsaládba'], answer: 0, explain: 'A magyar finnugor nyelv, bár a vándorlás során sok török és iráni eredetű szót is átvett.' },
    { q: 'Melyik nép támadása is siettette a honfoglalást?', options: ['A mongoloké', 'Az oszmánoké', 'A rómaiaké', 'A besenyőké'], answer: 3, explain: '895 körül a besenyők támadása is hozzájárult, hogy a magyarok Etelközből átköltöztek a Kárpát-medencébe. A mongolok (tatárok) csak 1241-ben támadtak.' },
    { q: 'Mi történt 907-ben Pozsonynál?', options: ['Istvánt királlyá koronázták', 'A magyarok legyőzték a bajor sereget', 'A magyarok vereséget szenvedtek I. Ottótól', 'Meghalt Géza fejedelem'], answer: 1, explain: 'A pozsonyi győzelem megszilárdította a honfoglalást. A súlyos vereség 955-ben, Augsburgnál következett be.' },
    { q: 'Melyik fejedelem hívott elsőként hittérítőket az országba, és keresett kapcsolatot a német-római császárral?', options: ['Géza', 'Árpád', 'Koppány', 'Imre herceg'], answer: 0, explain: 'Géza fejedelem (972 körül került hatalomra) kezdte meg a keresztény Európába való beilleszkedést, amit fia, István fejezett be.' },
    { q: 'A hagyomány szerint melyik pápa küldött koronát Istvánnak?', options: ['II. Orbán', 'III. Ince', 'II. Szilveszter', 'I. Gergely'], answer: 2, explain: 'A hagyomány szerint II. Szilveszter pápa küldte a koronát, amellyel Istvánt 1000 karácsonyán (vagy 1001 első napján) megkoronázták.' },
    { q: 'Melyik két érsekséget alapította Szent István?', options: ['A pécsit és a győrit', 'Az esztergomit és a kalocsait', 'A budait és a pozsonyit', 'Az egrit és a veszprémit'], answer: 1, explain: 'István két érsekséget (Esztergom, Kalocsa) és több püspökséget alapított, így megszervezte a magyar egyházat.' },
    { q: 'Ki állt István korában a vármegyék élén?', options: ['A nádor', 'A püspök', 'A fejedelem', 'Az ispán'], answer: 3, explain: 'A vármegyék királyi várak köré szerveződtek, élükön a király által kinevezett ispánokkal.' },
    { q: 'Kinek szólnak Szent István Intelmei?', options: ['Géza fejedelemnek', 'II. Szilveszter pápának', 'Koppánynak', 'Fiának, Imre hercegnek'], answer: 3, explain: 'Az Intelmekben István tanácsokat ad fiának az uralkodáshoz, többek között az idegenek befogadásának fontosságáról.' },

    { q: 'Melyik uralkodó nevéhez fűződik az aranyforint bevezetése és a bányászat fellendítése?', options: ['Károly Róbert', 'Mátyás király', 'II. András', 'Nagy Lajos'], answer: 0, explain: 'Az Anjou-házi Károly Róbert rendbe hozta a királyi pénzügyeket; Magyarország ekkor Európa egyik legnagyobb aranytermelője volt.' },

    { q: 'Ki volt az uralkodó, akit a kiegyezés után, 1867-ben magyar királlyá koronáztak?', options: ['V. Ferdinánd', 'Mária Terézia', 'II. József', 'Ferenc József'], answer: 3, explain: 'A kiegyezés után Ferenc Józsefet Budán magyar királlyá koronázták; ő lett az Osztrák–Magyar Monarchia uralkodója.' }

    { q: 'Melyik évben lépett be Magyarország a második világháborúba?', options: ['1939-ben', '1941-ben', '1944-ben', '1938-ban'], answer: 1, explain: 'A háború 1939-ben kezdődött, Magyarország 1941-ben, a Szovjetunió elleni háborúval lépett be.' },
    { q: 'Mit jelentett be Nagy Imre 1956 forradalmi napjaiban?', options: ['Az ország belépését a NATO-ba', 'A Magyar Köztársaság kikiáltását', 'A Kádár-kormány megalakulását', 'A kilépést a Varsói Szerződésből és az ország semlegességét'], answer: 3, explain: 'Nagy Imre november elején kilépett a Varsói Szerződésből és kimondta a semlegességet; november 4-én a szovjet csapatok leverték a forradalmat.' },

    { q: 'Ki fogalmazta meg a számítógép felépítésének alapelveit, a róla elnevezett elveket?', options: ['Neumann János', 'Kandó Kálmán', 'Bánki Donát', 'Szent-Györgyi Albert'], answer: 0, explain: 'A magyar születésű Neumann János nevéhez fűződnek a Neumann-elvek. Kandó Kálmán a villamos vasút, Bánki Donát a porlasztó fejlesztésében volt úttörő.' }

  <!-- interaktív elemek és az alkalmazás -->
  <script>/* js/widgets.js */
/* Tudásműhely – interaktív elemek (widgetek).
 * Leckében így lehet használni:  widget: { type: 'ohm', options: { ... } }
 * Elérhető típusok: ohm, soros-parhuzamos, feszultsegeses, negyutemu, attetel,
 * akkupakk, fuggveny, pitagorasz, gyakorlas, idovonal, hajitas, atomepito. */
(function () {
  'use strict';
  var S = window.STUDIE, fmt = S.fmt, esc = S.esc;
  var NS = 'http://www.w3.org/2000/svg';

  function head(title, help) {
    return '<div class="w-title">' + esc(title) + '</div>' + (help ? '<p class="w-help">' + S.inline(help) + '</p>' : '');
  }
  /* csúszka: [kulcs, felirat, min, max, lépés, érték, mértékegység] */
  function rng(k, label, min, max, step, val, unit) {
    return '<label>' + '<span class="lv"><span>' + esc(label) + '</span><b><span data-v="' + k + '">' + fmt(val) + '</span> ' + esc(unit || '') + '</b></span>' +
      '<input type="range" data-k="' + k + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"></label>';
  }
  function bind(el, update) {
    var inputs = el.querySelectorAll('input[type=range][data-k]');
    function read() {
      var v = {};
      inputs.forEach(function (i) {
        v[i.dataset.k] = parseFloat(i.value);
        var o = el.querySelector('[data-v="' + i.dataset.k + '"]');
        if (o) o.textContent = fmt(parseFloat(i.value));
      });
      return v;
    }
    inputs.forEach(function (i) { i.addEventListener('input', function () { update(read()); }); });
    update(read());
    return read;
  }
  function res(items) {
    return '<div class="w-res">' + items.map(function (x) { return '<div><small>' + esc(x[0]) + '</small><b>' + x[1] + '</b></div>'; }).join('') + '</div>';
  }
  function seg(name, opts, cur) {
    return '<div class="seg" data-seg="' + name + '">' + opts.map(function (o) {
      return '<button type="button" data-val="' + esc(o[0]) + '" class="' + (o[0] === cur ? 'on' : '') + '">' + esc(o[1]) + '</button>';
    }).join('') + '</div>';
  }
  function onSeg(el, name, cb) {
    var box = el.querySelector('[data-seg="' + name + '"]');
    box.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        box.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        cb(b.dataset.val);
      });
    });
  }
  /* Animáció, ami leáll, ha a widget eltűnik az oldalról. */
  function loop(el, fn) {
    var last = null;
    function tick(t) {
      if (!document.body.contains(el)) return;
      var dt = last == null ? 0 : Math.min(0.05, (t - last) / 1000);
      last = t; fn(dt);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ---------- 1. Ohm-törvény ---------- */
  S.addWidget('ohm', function (el, o) {
    el.innerHTML = head(o.title || 'Ohm törvénye – próbáld ki!', o.help || 'Állítsd a feszültséget és az ellenállást, és figyeld, hogyan változik az áram és a teljesítmény. Az izzó fényereje a teljesítménnyel nő.') +
      '<div class="w-grid"><div class="w-ctrl">' +
      rng('u', 'Feszültség (U)', 0, o.maxU || 24, 0.5, o.u || 12, 'V') +
      rng('r', 'Ellenállás (R)', 1, o.maxR || 100, 1, o.r || 12, 'Ω') +
      '</div><div class="w-out"><svg class="w-svg" viewBox="0 0 320 170">' +
      '<rect x="40" y="30" width="240" height="110" rx="10" fill="none" stroke-width="4" class="svg-line"/>' +
      '<rect x="20" y="62" width="40" height="46" rx="4" fill="var(--surface)" stroke-width="3" class="svg-line"/>' +
      '<text x="40" y="82" text-anchor="middle" class="svg-text" font-size="13" font-weight="700">+</text><text x="40" y="100" text-anchor="middle" class="svg-text" font-size="13">−</text>' +
      '<rect x="125" y="128" width="70" height="24" rx="3" fill="#c9a26b" stroke="#7a5a2b" stroke-width="2"/>' +
      '<text x="160" y="166" text-anchor="middle" class="svg-muted" font-size="11">ellenállás</text>' +
      '<circle id="glow" cx="160" cy="30" r="30" fill="#ffd54a" opacity="0"/>' +
      '<circle cx="160" cy="30" r="16" fill="var(--surface)" stroke-width="3" class="svg-line"/>' +
      '<path d="M152 34 q4 -12 8 0 q4 -12 8 0" fill="none" stroke="#b8860b" stroke-width="2"/>' +
      '<g id="dots"></g></svg><div class="w-formula" id="f"></div><div id="r"></div></div></div>';
    var dots = el.querySelector('#dots'), glow = el.querySelector('#glow');
    var path = [[40, 30], [280, 30], [280, 140], [40, 140]];
    var per = 2 * (240 + 110), n = 14, pos = 0, I = 0;
    for (var i = 0; i < n; i++) { var c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 3.5); c.setAttribute('fill', '#2f7bf6'); dots.appendChild(c); }
    function pt(d) {
      d = ((d % per) + per) % per;
      if (d < 240) return [40 + d, 30]; d -= 240;
      if (d < 110) return [280, 30 + d]; d -= 110;
      if (d < 240) return [280 - d, 140]; d -= 240;
      return [40, 140 - d];
    }
    bind(el, function (v) {
      I = v.u / v.r; var P = v.u * I;
      el.querySelector('#f').textContent = 'I = U / R = ' + fmt(v.u) + ' V / ' + fmt(v.r) + ' Ω = ' + fmt(I, 3) + ' A';
      el.querySelector('#r').innerHTML = res([['Áramerősség (I)', fmt(I, 3) + ' A'], ['Teljesítmény (P = U·I)', fmt(P, 2) + ' W'], ['Áram mA-ben', fmt(I * 1000, 0) + ' mA']]);
      glow.setAttribute('opacity', Math.min(1, P / 20).toFixed(2));
    });
    loop(el, function (dt) {

  /* ---------- 5. Fogaskerék-áttétel ---------- */
  function gearPath(cx, cy, z, m) {
    var rp = z * m / 2, ra = rp + m, rf = rp - 1.25 * m, d = '';
    for (var i = 0; i < z; i++) {
      var a = i * 2 * Math.PI / z, t = Math.PI / z;
      var pts = [[rf, a - t * 0.55], [ra, a - t * 0.28], [ra, a + t * 0.28], [rf, a + t * 0.55], [rf, a + t * 1.45]];
      pts.forEach(function (p, j) {
        d += (i === 0 && j === 0 ? 'M' : 'L') + (cx + p[0] * Math.cos(p[1])).toFixed(1) + ' ' + (cy + p[0] * Math.sin(p[1])).toFixed(1) + ' ';
      });
    }
    return d + 'Z';
  }

    },
    szazalek: function () {
      var p = [5, 10, 15, 20, 25, 30, 40, 50, 75][ri(0, 8)], base = ri(2, 40) * 20;
      return { task: base + ' ' + p + '%-a = ?', answer: base * p / 100,
        steps: ['1% = ' + base + ' / 100 = ' + fmt(base / 100), p + '% = ' + fmt(base / 100) + ' · ' + p + ' = ' + fmt(base * p / 100)] };
    },
    ohm: function () {
      var r = [2, 4, 5, 10, 20, 50, 100][ri(0, 6)], i = [0.5, 1, 2, 3, 4, 5][ri(0, 5)], u = r * i, k = ri(0, 2);

      return { task: 'U = ' + fmt(u) + ' V, I = ' + fmt(i) + ' A → R = ? (Ω)', answer: r, steps: ['R = U / I = ' + fmt(u) + ' / ' + fmt(i) + ' = ' + r + ' Ω'] };
    },
    tortek: function () {
      var a = ri(1, 5), b = ri(2, 6), c = ri(1, 5), d = ri(2, 6);
      function g(x, y) { return y ? g(y, x % y) : x; }
      var n = a * d + c * b, m = b * d, k = g(n, m);

      '<div class="w-grid"><div class="w-ctrl">' + rng('ugs', 'Gate–source feszültség (U_GS)', 0, 5, 0.1, 3, 'V') + rng('uds', 'Drain–source feszültség (U_DS)', 0, 5, 0.05, 2, 'V') +

      '<div class="w-out"><svg class="w-svg" viewBox="0 0 360 260" id="p"></svg><div class="w-formula">lineáris: I_D = k·[(U_GS − U_T)·U_DS − U_DS²/2]·(1 + λ·U_DS)<br>telítés: I_D = (k/2)·(U_GS − U_T)²·(1 + λ·U_DS)</div></div></div>';
    var X0 = 44, Y0 = 228, W = 300, H = 210, IMAX = 40;

      if (ov <= 0) return 0;
